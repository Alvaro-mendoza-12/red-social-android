# 🔥 CONÉCTATE GRADLE CONFIGURATION - Optimizada y compatible
# Configuración de memoria y JVM para builds eficientes

# 🔥 GRADLE DAEMON OPTIMIZATION
# Nota: el proyecto es grande y el compilador de Kotlin puede quedarse sin memoria.
# Si tu PC tiene poca RAM (<= 8GB), baja estos valores (por ejemplo 2048m/3072m).
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=1024m -XX:+UseG1GC -XX:+UseStringDeduplication -XX:CICompilerCount=2 -Xss1m -Dfile.encoding=UTF-8 --add-opens java.base/java.util=ALL-UNNAMED --add-opens java.base/java.lang=ALL-UNNAMED --add-opens java.base/java.io=ALL-UNNAMED --add-opens java.base/java.lang.reflect=ALL-UNNAMED --add-opens java.base/java.util.concurrent=ALL-UNNAMED

# 🔥 GRADLE DAEMON SETTINGS
org.gradle.daemon=true
org.gradle.daemon.idletimeout=3600000
org.gradle.daemon.termination.timeout=60000

# 🔥 PARALLEL EXECUTION
org.gradle.parallel=false
org.gradle.workers.max=1
org.gradle.configureondemand=false

# 🔥 BUILD CACHE OPTIMIZATION
org.gradle.caching=true
org.gradle.cache.cleanup=true
org.gradle.cache.reservation.cleanup=true
org.gradle.cache.cleanup.interval=86400000

# 🔥 CONFIGURATION CACHE
org.gradle.configuration-cache=false
org.gradle.configuration-cache.problems=warn
org.gradle.configuration-cache.parallel=true

# 🔥 ANDROID SETTINGS - Compatibles y modernos
android.useAndroidX=true
android.enableJetifier=true
# R8 full mode triggered intermittent internal ConcurrentModificationException
# in release minification on this project. Keep release minification enabled,
# but use the safer compatibility mode for Play Store bundles.
android.enableR8.fullMode=false
android.bundle.enable16kPageAlignment=true
android.enableNonTransitiveRClass=true
android.enablePackagedResources=true
android.enableResourceOptimizations=true

# 🔥 KOTLIN COMPILATION OPTIMIZATION
kotlin.incremental=true
kotlin.incremental.usePreciseJavaTracking=true
kotlin.build.report.output=file
kotlin.build.report.destination=${buildDir}/kotlin-build-report.txt
# Memoria extra para el daemon de Kotlin (soluciona: OutOfMemoryError: Java heap space en :app:compileDebugKotlin)
kotlin.daemon.jvmargs=-Xmx5120m -XX:MaxMetaspaceSize=1024m -XX:+UseG1GC --add-opens=java.base/java.io=ALL-UNNAMED --add-opens=java.base/java.lang=ALL-UNNAMED --add-opens=java.base/java.lang.reflect=ALL-UNNAMED --add-opens=java.base/java.util=ALL-UNNAMED

# El daemon conserva la compilación incremental; in-process reconstruía todo
# el módulo en cada cambio. Gradle y Kotlin tienen límites distintos para evitar
# los dos heaps de 6 GB que agotaban la RAM junto a Android Studio.
kotlin.compiler.execution.strategy=daemon

# 🔥 COMPOSE OPTIMIZATION
android.enableComposeCompilerReports=false
android.enableComposeCompilerMetrics=false
android.enableComposeResources=true

# 🔥 NETWORK OPTIMIZATION
org.gradle.dependency.verification=off
org.gradle.dependency.verification.mode=off
org.gradle.internal.http.connectionTimeout=60000
org.gradle.internal.http.socketTimeout=60000

# JDK 17-21 is supplied by Android Studio, JAVA_HOME or the CI setup-java step.
# Newer runtimes are rejected in settings.gradle.kts because Gradle/AGP test
# task reflection is not reliable there yet (observed with JDK 24).
# Never pin a developer-specific absolute path here: Gradle reads this file on
# Linux release runners and on every collaborator's workstation.
