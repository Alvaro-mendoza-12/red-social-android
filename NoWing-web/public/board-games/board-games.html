<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Juegos de mesa · Novvin</title>
  <link rel="stylesheet" href="./board-games.css">
  <script type="module" src="./board-games.js"></script>
</head>
<body>
  <main>
    <header class="portal-header">
      <a id="back" href="/app/games">‹ Juegos</a>
      <span>Novvin</span>
    </header>
    <div id="hub">
      <h1>Juegos de mesa</h1>
      <nav id="games" aria-label="Elegir juego">
        <button type="button" data-game="chess"><span class="game-preview" aria-hidden="true">♞</span><span>Ajedrez</span></button>
        <button type="button" data-game="ludo"><span class="game-preview" aria-hidden="true">⚄</span><span>Ludo</span></button>
        <button type="button" data-game="checkers"><span class="game-preview" aria-hidden="true"><i></i><i></i></span><span>Damas</span></button>
        <button type="button" data-game="tic_tac_toe"><span class="game-preview" aria-hidden="true"><b>×</b><b>○</b></span><span>Tres en raya</span></button>
        <button type="button" data-game="connect_four"><span class="game-preview" aria-hidden="true"><i></i><i></i><i></i></span><span>Cuatro en línea</span></button>
      </nav>
      <nav class="play-modes" aria-label="Modalidad de juego">
        <button type="button" class="primary" id="open-online">Jugar en línea</button>
        <button type="button" id="open-friends">Jugar con amigos</button>
        <button type="button" id="open-offline">En este dispositivo</button>
        <button type="button" id="open-ranking">Torneo semanal</button>
      </nav>
    </div>
    <form id="setup">
      <label>Modo<select id="mode"><option value="local">En este dispositivo</option><option value="bot">Contra Novvin</option></select></label>
      <label id="players-control" hidden>Jugadores<select id="players"><option>2</option><option>3</option><option>4</option></select></label>
      <label id="level-control" hidden>Dificultad<select id="level"><option value="0">Principiante</option><option value="1">Fácil</option><option value="2" selected>Intermedio</option><option value="3">Avanzado</option><option value="4">Experto</option></select></label>
      <button class="primary" type="submit">Empezar partida</button>
    </form>
    <section id="online" hidden aria-label="Partidas en línea">
      <p id="online-status" role="status"></p>
      <div id="room-controls">
        <label id="online-players-control" hidden>Jugadores de Ludo<select id="online-players"><option>2</option><option>3</option><option>4</option></select></label>
        <button type="button" id="find-room" class="primary">Encontrar partida</button>
        <button type="button" id="create-private">Invitar amigos</button>
        <button type="button" id="refresh-rooms">Actualizar salas</button>
      </div>
      <div id="rooms"></div>
      <section id="waiting" hidden>
        <h2 id="waiting-title" tabindex="-1"></h2>
        <p id="waiting-description"></p>
        <label id="friend-filter-label" hidden>Buscar en tus amigos<input id="friend-filter" type="search" maxlength="80"></label>
        <div id="friends"></div>
        <p id="friends-empty" role="status" hidden></p>
        <button type="button" id="retry-friends" hidden>Reintentar lista</button>
        <button type="button" id="leave-waiting">Salir de la sala</button>
      </section>
    </section>
    <section id="ranking" hidden aria-label="Torneo semanal">
      <h2>Torneo semanal</h2>
      <p id="ranking-period" role="status"></p>
      <p>Las victorias en partidas públicas cuentan para la clasificación.</p>
      <h3>Podio de la semana pasada</h3>
      <ol id="previous-podium"></ol>
      <h3>Los 100 primeros</h3>
      <ol id="weekly-top"></ol>
    </section>
    <section id="table" hidden aria-label="Partida">
      <div class="table-heading">
        <h2 id="game-title" tabindex="-1"></h2>
        <button id="return-to-lobby" type="button"><span aria-hidden="true">‹</span> Salir a juegos</button>
      </div>
      <div id="opponents" aria-label="Jugadores de la partida" hidden></div>
      <p id="status" role="status"></p>
      <div class="board-stage">
        <div id="board" role="group" aria-label="Tablero"></div>
      </div>
      <div class="turn-controls">
        <button class="primary" id="roll" type="button" hidden><span id="die-face" aria-hidden="true">⚄</span><span id="roll-label">Lanzar dado</span></button>
        <div id="tokens"></div>
        <button id="claim" type="button" hidden>Reclamar tablas</button>
        <button id="resign" type="button" hidden>Abandonar</button>
        <button id="restart" type="button">Nueva partida</button>
      </div>
      <section id="online-reactions" hidden aria-label="Reacciones">
        <div id="reaction-buttons"></div>
        <p id="reaction-status" role="status"></p>
      </section>
      <dialog id="promotion" aria-label="Elegir promoción">
        <p>Promocionar a</p>
        <form method="dialog">
          <button value="q">Dama</button><button value="r">Torre</button>
          <button value="b">Alfil</button><button value="n">Caballo</button>
          <button value="">Volver</button>
        </form>
      </dialog>
      <details><summary>Historial</summary><ol id="moves"></ol></details>
      <details><summary>Reglas de esta partida</summary><p id="rules"></p></details>
    </section>
  </main>
</body>
</html>
