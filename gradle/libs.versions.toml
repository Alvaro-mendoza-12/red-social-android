material = "1.11.0"

# Compose
composeBom = "2023.10.01"
navigationCompose = "2.7.5"
composeCompiler = "1.5.8"

# Supabase
supabaseRealtime = "2.0.4"
supabaseGotrue = "2.0.4"
supabasePostgrest = "2.0.4"
supabaseStorage = "2.0.4"

# Ktor
ktor = "2.3.5"

# Firebase
firebaseMessaging = "23.4.0"
firebaseCrashlytics = "2.9.9"
firebaseCrashlyticsKtx = "18.4.0"
googleServices = "4.4.0"

# DI
hilt = "2.51"
hiltNavigationCompose = "1.1.0"
hiltWork = "1.1.0"

# Image & Video
coil = "2.5.0"
media3 = "1.5.1"

# Utils
accompanistPermissions = "0.32.0"
mlkitSegmentation = "16.0.0-beta6"
mlkitTextRecognition = "16.0.1"
