name: Android Instrumented Smoke

on:
  workflow_dispatch:
    inputs:
      allow_temporary_kvm_access:
        description: 'Approve runner-only KVM access for these three jobs, restored afterward'
        type: boolean
        required: false
        default: false
  schedule:
    - cron: "0 8 * * 1"

permissions:
  contents: read

concurrency:
  group: android-instrumented-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  connected-debug-tests:
    # Keep the full suite available outside the isolated account-retest branch.
    if: github.ref != 'refs/heads/correcciones-dot'
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare local Android config
        shell: bash
        run: |
          echo "sdk.dir=${ANDROID_SDK_ROOT}" > local.properties

      - name: Prepare CI secrets file
        shell: bash
        run: |
          echo "FALLBACK_API_URL=https://api.example.invalid" > secrets.properties
          echo "SIGNALING_URL=https://voice.example.invalid" >> secrets.properties
          echo "BACKEND_DISCOVERY_HOST=discovery.example.invalid" >> secrets.properties

      - name: Prepare isolated Firebase and debug signing inputs
        run: python tools/prepare_android_ci.py

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Run instrumented smoke tests on emulator
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_6
          target: google_apis
          disable-animations: true
          script: ./gradlew --no-daemon --stacktrace :app:connectedDebugAndroidTest

      - name: Upload connected test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: connected-debug-test-reports
          path: |
            app/build/reports/androidTests/connected
            app/build/outputs/androidTest-results/connected
          if-no-files-found: warn

  saved-account-tests:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/correcciones-dot'
    name: Saved account / ${{ matrix.test }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      NOVVIN_CI_FIXTURE: "true"
      NOVVIN_KVM_ACCESS_APPROVED: ${{ inputs.allow_temporary_kvm_access && 'true' || 'false' }}
    strategy:
      fail-fast: false
      matrix:
        test:
          - SavedAccountLogoutLoginFlowTest
          - SecondarySavedAccountLoginFlowTest
          - MessagesMultiAccountSwitchingTest
    steps:
      - name: Checkout isolated branch
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Require existing hardware acceleration
        run: |
          echo "Runner identity and groups:"
          id
          echo "KVM device and access metadata (read-only):"
          if [[ -e /dev/kvm ]]; then
            stat -c '%F %A %a %U:%G %n' /dev/kvm
            if command -v getfacl >/dev/null 2>&1; then
              getfacl -p /dev/kvm
            fi
          else
            echo "No /dev/kvm device is present on this runner."
          fi
          # Missing hardware still fails. Approved access is granted only just
          # before emulator use, then restored by the always-run cleanup step.
          test -c /dev/kvm
          if [[ "${NOVVIN_KVM_ACCESS_APPROVED}" != true ]]; then
            test -r /dev/kvm && test -w /dev/kvm
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare synthetic Android inputs
        shell: bash
        run: |
          echo "sdk.dir=${ANDROID_HOME}" > local.properties
          echo "FALLBACK_API_URL=https://api.example.invalid" > secrets.properties
          echo "SIGNALING_URL=https://voice.example.invalid" >> secrets.properties
          echo "BACKEND_DISCOVERY_HOST=discovery.example.invalid" >> secrets.properties
          python tools/prepare_android_ci.py
          chmod +x ./gradlew

      - name: Expose installed Android command-line tools
        run: |
          test -x "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          test -x "${ANDROID_HOME}/cmdline-tools/latest/bin/avdmanager"
          printf '%s\n' "${ANDROID_HOME}/cmdline-tools/latest/bin" "${ANDROID_HOME}/platform-tools" "${ANDROID_HOME}/emulator" >> "$GITHUB_PATH"

      - name: Install only stable AOSP SDK packages
        # Use the hosted runner's accepted licenses. Fail rather than accept
        # every available agreement via sdkmanager --licenses.
        run: sdkmanager --install "platforms;android-36" "build-tools;35.0.0" "emulator" "system-images;android-34;default;x86_64" --channel=0 </dev/null

      - name: Build before starting emulator
        run: ./gradlew --no-daemon --max-workers=2 --stacktrace :app:assembleDebug :app:assembleDebugAndroidTest

      - name: Grant approved temporary runner-only KVM access
        if: inputs.allow_temporary_kvm_access
        run: python tools/android_kvm_acl.py grant

      - name: Run one account case in a fresh offline emulator
        run: bash tools/run_android_account_smoke.sh "${{ matrix.test }}"

      - name: Restore and verify original KVM ACL
        if: always() && inputs.allow_temporary_kvm_access
        run: python tools/android_kvm_acl.py restore

      - name: Upload case results and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: saved-account-${{ matrix.test }}
          path: |
            app/build/reports/account-smoke
            app/build/reports/androidTests/connected
            app/build/outputs/androidTest-results/connected
          if-no-files-found: warn
