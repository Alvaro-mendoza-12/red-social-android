name: Android Instrumented Smoke

on:
  workflow_dispatch:
  schedule:
    - cron: "0 8 * * 1"

concurrency:
  group: android-instrumented-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  connected-debug-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare local Android config
        shell: bash
        run: |
          echo "sdk.dir=${ANDROID_SDK_ROOT}" > local.properties

      - name: Prepare CI secrets file
        shell: bash
        run: |
          echo "FALLBACK_API_URL=https://api.example.invalid" > secrets.properties
          echo "SIGNALING_URL=https://voice.example.invalid" >> secrets.properties

      - name: Prepare isolated Firebase and debug signing inputs
        run: python tools/prepare_android_ci.py

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Run instrumented smoke tests on emulator
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_6
          target: google_apis
          disable-animations: true
          script: ./gradlew --no-daemon --stacktrace :app:connectedDebugAndroidTest

      - name: Upload connected test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: connected-debug-test-reports
          path: |
            app/build/reports/androidTests/connected
            app/build/outputs/androidTest-results/connected
          if-no-files-found: warn
