name: Conectate CI (Android + Web)

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

concurrency:
  group: conectate-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-quality:
    name: Android - quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare local Android config
        shell: bash
        run: |
          echo "sdk.dir=${ANDROID_SDK_ROOT}" > local.properties

      - name: Prepare CI secrets file
        shell: bash
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          echo "SUPABASE_URL=${SUPABASE_URL:-https://placeholder.supabase.co}" > secrets.properties
          echo "SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY:-placeholder-anon-key}" >> secrets.properties

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Run quality gate
        run: ./gradlew --no-daemon --stacktrace :app:qualityGateDebug

      - name: Run SQL security audit
        run: python tools/security_sql_audit.py --root . --manifest sql/release-manifest.txt --baseline tools/security_audit_baseline.json --report build/reports/security/sql_security_audit.md --json build/reports/security/sql_security_audit.json --fail-threshold HIGH

      - name: Run runtime security audit
        run: python tools/runtime_security_audit.py --root . --report build/reports/security/runtime_security_audit.md --json build/reports/security/runtime_security_audit.json --fail-threshold HIGH

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-quality-reports
          path: |
            app/build/reports/lint-results-debug.html
            app/build/reports/lint-results-debug.xml
            app/build/reports/tests/testDebugUnitTest
            app/build/test-results/testDebugUnitTest
            build/reports/security/sql_security_audit.md
            build/reports/security/sql_security_audit.json
            build/reports/security/runtime_security_audit.md
            build/reports/security/runtime_security_audit.json
          if-no-files-found: warn

  android-release-smoke:
    name: Android - release smoke
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: android-quality
    if: github.event_name == 'push'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare local Android config
        shell: bash
        run: |
          echo "sdk.dir=${ANDROID_SDK_ROOT}" > local.properties

      - name: Prepare CI secrets file
        shell: bash
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          echo "SUPABASE_URL=${SUPABASE_URL:-https://placeholder.supabase.co}" > secrets.properties
          echo "SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY:-placeholder-anon-key}" >> secrets.properties

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build release smoke artifacts
        run: ./gradlew --no-daemon --stacktrace :app:assembleRelease :app:bundleRelease

      - name: Check performance budgets
        run: python tools/performance_budget_check.py --artifacts app/build/outputs/apk/release app/build/outputs/bundle/release/app-release.aab --budgets tools/perf_budgets.json --report build/reports/perf/performance_budget_report.md --json build/reports/perf/performance_budget_report.json

      - name: Upload performance reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-release-performance-reports
          path: |
            build/reports/perf/performance_budget_report.md
            build/reports/perf/performance_budget_report.json
          if-no-files-found: warn

  web-quality:
    name: Web - lint & build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: Conectate-web/package-lock.json

      - name: Install deps
        run: npm --prefix Conectate-web ci --legacy-peer-deps

      - name: Lint
        run: npm --prefix Conectate-web run lint

      - name: Build
        run: npm --prefix Conectate-web run build

      - name: Upload dist
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: Conectate-web/dist
          if-no-files-found: warn
