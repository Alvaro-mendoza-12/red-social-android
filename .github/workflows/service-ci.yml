name: Web and service quality

on:
  push:
    branches:
      - main
      - master
      - develop
      - feature/live-gifts
  pull_request:

permissions:
  contents: read

concurrency:
  group: service-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  services:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            directory: infrastructure/local-fallback/api
          - name: signaling
            directory: signaling-server
          - name: realtime
            directory: infrastructure/local-fallback/realtime-gateway
          - name: chatbot
            directory: infrastructure/local-fallback/ai-chatbot
    name: ${{ matrix.name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ${{ matrix.directory }}/package-lock.json
      - name: Install from lockfile
        working-directory: ${{ matrix.directory }}
        run: npm ci
      - name: Check syntax
        working-directory: ${{ matrix.directory }}
        run: npm run check --if-present
      - name: Run tests
        working-directory: ${{ matrix.directory }}
        run: npm test
      - name: Audit direct and transitive dependencies
        working-directory: ${{ matrix.directory }}
        run: npm audit --audit-level=moderate

  points-idempotency:
    name: Channel point redemption transactions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: novvin_qa
          POSTGRES_PASSWORD: synthetic_ci_password
          POSTGRES_DB: novvin_points_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U novvin_qa -d novvin_points_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: infrastructure/local-fallback/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: infrastructure/local-fallback/api/package-lock.json
      - run: npm ci
      - name: Verify owner isolation and concurrent replay on PostgreSQL
        env:
          NOVVIN_POINTS_TEST_DATABASE_URL: postgresql://novvin_qa:synthetic_ci_password@127.0.0.1:5432/novvin_points_test
          NOVVIN_POINTS_TEST_BOOTSTRAP: 'true'
        run: node --test tests/live-points-redemption.postgres.test.js

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: NoWing-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: NoWing-web/package-lock.json
      - name: Install from lockfile
        run: npm ci --legacy-peer-deps
      - name: Test
        run: npm test -- --runInBand
      - name: Lint
        run: npm run lint
      - name: Build with a non-deployed CI origin
        env:
          VITE_FALLBACK_API_URL: https://ci.invalid
        run: npm run build
      - name: Public SEO, privacy boundaries, media and socket regressions
        run: npm run test:node
      - name: Audit direct and transitive dependencies
        run: npm audit --audit-level=moderate
