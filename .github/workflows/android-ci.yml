name: Android Quality Gate

on:
  push:
    branches:
      - main
      - master
      - develop
      - feature/live-gifts
      - correcciones-dot
  pull_request:
  workflow_dispatch:

concurrency:
  group: android-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    env:
      NOVVIN_CI_FIXTURE: "true"
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install release tooling dependencies
        run: python -m pip install -r tools/requirements.txt

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare local Android config
        shell: bash
        run: |
          echo "sdk.dir=${ANDROID_SDK_ROOT}" > local.properties

      - name: Prepare CI secrets file
        shell: bash
        run: |
          echo "FALLBACK_API_URL=https://api.example.invalid" > secrets.properties
          echo "SIGNALING_URL=https://voice.example.invalid" >> secrets.properties
          echo "BACKEND_DISCOVERY_HOST=discovery.example.invalid" >> secrets.properties

      - name: Prepare isolated Firebase and debug signing inputs
        run: python tools/prepare_android_ci.py

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Run quality gate
        run: ./gradlew --no-daemon --stacktrace :app:qualityGateDebug

      - name: Test release and security tooling
        run: python -m unittest discover -s tools/tests -p 'test_*.py'

      - name: Verify packaged Android startup classes
        run: |
          ./gradlew --no-daemon :app:assembleDebug
          python tools/verify_android_startup.py app/build/outputs/apk/debug/app-debug.apk

      - name: Run SQL security audit
        run: python tools/security_sql_audit.py --root . --manifest sql/release-manifest.txt --baseline tools/security_audit_baseline.json --report build/reports/security/sql_security_audit.md --json build/reports/security/sql_security_audit.json --fail-threshold HIGH

      - name: Run runtime security audit
        run: python tools/runtime_security_audit.py --root . --report build/reports/security/runtime_security_audit.md --json build/reports/security/runtime_security_audit.json --fail-threshold HIGH

      - name: Upload lint and test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-quality-reports
          path: |
            app/build/reports/lint-results-debug.html
            app/build/reports/lint-results-debug.xml
            app/build/reports/tests/testDebugUnitTest
            app/build/test-results/testDebugUnitTest
            build/reports/security/sql_security_audit.md
            build/reports/security/sql_security_audit.json
            build/reports/security/runtime_security_audit.md
            build/reports/security/runtime_security_audit.json
          if-no-files-found: warn

  release-smoke:
    if: github.event_name == 'push'
    needs: quality-gate
    env:
      NOVVIN_CI_FIXTURE: "true"
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install release tooling dependencies
        run: python -m pip install -r tools/requirements.txt

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare local Android config
        shell: bash
        run: |
          echo "sdk.dir=${ANDROID_SDK_ROOT}" > local.properties

      - name: Prepare CI secrets file
        shell: bash
        run: |
          echo "FALLBACK_API_URL=https://api.example.invalid" > secrets.properties
          echo "SIGNALING_URL=https://voice.example.invalid" >> secrets.properties
          echo "BACKEND_DISCOVERY_HOST=discovery.example.invalid" >> secrets.properties

      - name: Create ephemeral release-smoke signing key
        shell: bash
        run: |
          SMOKE_PASSWORD="$(openssl rand -hex 16)"
          keytool -genkeypair -noprompt \
            -keystore "$RUNNER_TEMP/novvin-ci-upload.jks" \
            -storepass "$SMOKE_PASSWORD" \
            -keypass "$SMOKE_PASSWORD" \
            -alias novvin-ci \
            -dname "CN=NOVVIN CI,OU=Engineering,O=NOVVIN,L=CI,ST=CI,C=US" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 1
          {
            echo "storeFile=$RUNNER_TEMP/novvin-ci-upload.jks"
            echo "storePassword=$SMOKE_PASSWORD"
            echo "keyAlias=novvin-ci"
            echo "keyPassword=$SMOKE_PASSWORD"
          } > keystore.properties

      - name: Prepare isolated Firebase and debug signing inputs
        run: python tools/prepare_android_ci.py

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Test release tooling
        run: python -m unittest discover -s tools/tests -p 'test_*.py'

      - name: Build release smoke artifacts
        run: ./gradlew --no-daemon --stacktrace :app:assembleRelease :app:bundleRelease

      - name: Verify R8 runtime entry points
        run: python tools/verify_r8_release.py --report build/reports/release/r8-release-verification.md --json build/reports/release/r8-release-verification.json

      - name: Verify release bundle signature
        shell: bash
        run: |
          mkdir -p build/reports/release
          set -o pipefail
          python tools/verify_android_release.py app/build/outputs/bundle/release/app-release.aab \
            | tee build/reports/release/signature-verification.txt

      - name: Verify 16 KiB page-size compatibility
        run: python tools/verify_android_page_size.py app/build/outputs/bundle/release/app-release.aab

      - name: Check performance budgets
        run: python tools/performance_budget_check.py --artifacts app/build/outputs/bundle/release/app-release.aab --budgets tools/perf_budgets.json --report build/reports/perf/performance_budget_report.md --json build/reports/perf/performance_budget_report.json

      - name: Upload release performance reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-release-performance-reports
          path: |
            build/reports/perf/performance_budget_report.md
            build/reports/perf/performance_budget_report.json
            build/reports/release/signature-verification.txt
            build/reports/release/r8-release-verification.md
            build/reports/release/r8-release-verification.json
          if-no-files-found: warn

  backend-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: novvin_test
          POSTGRES_PASSWORD: isolated-ci-only
          POSTGRES_DB: novvin_friend_concurrency_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U novvin_test -d novvin_friend_concurrency_test"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      NOVVIN_FRIEND_CONCURRENCY_DATABASE_URL: postgres://novvin_test:isolated-ci-only@127.0.0.1:5432/novvin_friend_concurrency_test

    defaults:
      run:
        working-directory: infrastructure/local-fallback/api

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: infrastructure/local-fallback/api/package-lock.json

      - name: Install backend dependencies
        run: npm ci

      - name: Install signaling dependencies for production contracts
        working-directory: signaling-server
        run: npm ci

      - name: Validate API contracts and security
        run: |
          npm run check
          for script in $(node -p "Object.keys(require('./package.json').scripts).filter(name => name.startsWith('test:')).join(' ')"); do
            npm run "$script"
          done
          npm audit --omit=dev --audit-level=low

  client-and-realtime-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Validate web production build and tests
        working-directory: NoWing-web
        env:
          VITE_FALLBACK_API_URL: https://ci.novvin.invalid
        run: |
          npm ci
          npm run lint
          npm test -- --runInBand
          npm run build
          npm audit --omit=dev --audit-level=low

      - name: Validate realtime gateway
        working-directory: infrastructure/local-fallback/realtime-gateway
        run: |
          npm ci
          npm run check
          npm test
          npm audit --omit=dev --audit-level=low

      - name: Validate signaling server
        working-directory: signaling-server
        run: |
          npm ci
          npm run check
          npm test
          npm audit --omit=dev --audit-level=low

      - name: Validate first-party AI service
        working-directory: infrastructure/local-fallback/ai-chatbot
        run: |
          npm run check
          npm test

