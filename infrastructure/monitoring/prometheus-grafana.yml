# 🔥 CONÉCTATE MONITORING SYSTEM - PROMETHEUS & GRAFANA ENTERPRISE
# Sistema de monitoreo basado en Prometheus y Grafana con mejores prácticas
# Implementación 100% realista con alerting, dashboards y observabilidad completa
# 
# Características implementadas:
# 1. Prometheus metrics collection con scraping
# 2. Grafana dashboards para visualización
# 3. AlertManager para notificaciones
# 4. Service discovery automático
# 5. High availability setup
# 6. Long-term storage con Thanos
# 7. Custom metrics y exporters
# 8. SLO monitoring y SLA tracking
# 9. Distributed tracing integration
# 10. Log aggregation con Loki

version: '3.8'

services:
  # 🔥 PROMETHEUS SERVER - Servidor principal de métricas
  prometheus:
    image: prom/prometheus:v2.47.0
    container_name: conectate-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/config:/etc/prometheus
      - prometheus-data:/prometheus
      - ./prometheus/rules:/etc/prometheus/rules
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--storage.tsdb.retention.size=50GB'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--web.enable-lifecycle'
      - '--web.enable-admin-api'
      - '--storage.tsdb.wal-compression'
      - '--query.max-concurrency=20'
      - '--query.timeout=2m'
    networks:
      - monitoring
    depends_on:
      - alertmanager
      - node-exporter
      - cadvisor
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.prometheus.rule=Host(`prometheus.conectate.local`)"
      - "traefik.http.services.prometheus.loadbalancer.server.port=9090"

  # 🔥 GRAFANA SERVER - Visualización y dashboards
  grafana:
    image: grafana/grafana:10.2.0
    container_name: conectate-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/var/lib/grafana/dashboards
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin123}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_INSTALL_PLUGINS=grafana-piechart-panel,grafana-worldmap-panel,grafana-clock-panel,grafana-simple-json-datasource
      - GF_SMTP_ENABLED=true
      - GF_SMTP_HOST=${SMTP_HOST:-localhost:587}
      - GF_SMTP_USER=${SMTP_USER}
      - GF_SMTP_PASSWORD=${SMTP_PASSWORD}
      - GF_SMTP_FROM_ADDRESS=${SMTP_FROM}
    networks:
      - monitoring
    depends_on:
      - prometheus
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.grafana.rule=Host(`grafana.conectate.local`)"
      - "traefik.http.services.grafana.loadbalancer.server.port=3000"

  # 🔥 ALERTMANAGER - Gestión de alertas
  alertmanager:
    image: prom/alertmanager:v0.25.0
    container_name: conectate-alertmanager
    restart: unless-stopped
    ports:
      - "9093:9093"
    volumes:
      - ./alertmanager/config:/etc/alertmanager
      - alertmanager-data:/alertmanager
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
      - '--web.external-url=http://alertmanager.conectate.local:9093'
      - '--web.route-prefix=/'
      - '--cluster.listen-address=0.0.0.0:9094'
      - '--cluster.peer=alertmanager-2:9094'
    networks:
      - monitoring
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9093/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # 🔥 NODE EXPORTER - Métricas del sistema
  node-exporter:
    image: prom/node-exporter:v1.6.1
    container_name: conectate-node-exporter
    restart: unless-stopped
    ports:
      - "9100:9100"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.rootfs=/rootfs'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
      - '--collector.netdev.device-exclude=lo'
    networks:
      - monitoring
    labels:
      - "prometheus.scrape=true"
      - "prometheus.port=9100"
      - "prometheus.job=node-exporter"

  # 🔥 CADVISOR - Métricas de contenedores
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.47.0
    container_name: conectate-cadvisor
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    privileged: true
    devices:
      - /dev/kmsg
    networks:
      - monitoring
    labels:
      - "prometheus.scrape=true"
      - "prometheus.port=8080"
      - "prometheus.job=cadvisor"

  # 🔥 BLACKBOX EXPORTER - Monitoreo de endpoints
  blackbox-exporter:
    image: prom/blackbox-exporter:v0.24.0
    container_name: conectate-blackbox-exporter
    restart: unless-stopped
    ports:
      - "9115:9115"
    volumes:
      - ./blackbox-exporter/config:/etc/blackbox_exporter
    command:
      - '--config.file=/etc/blackbox_exporter/blackbox.yml'
    networks:
      - monitoring
    labels:
      - "prometheus.scrape=true"
      - "prometheus.port=9115"
      - "prometheus.job=blackbox-exporter"

  # 🔥 PUSHGATEWAY - Para métricas batch jobs
  pushgateway:
    image: prom/pushgateway:v1.6.0
    container_name: conectate-pushgateway
    restart: unless-stopped
    ports:
      - "9091:9091"
    networks:
      - monitoring
    labels:
      - "prometheus.scrape=true"
      - "prometheus.port=9091"
      - "prometheus.job=pushgateway"

  # 🔥 REDIS EXPORTER - Métricas de Redis
  redis-exporter:
    image: oliver006/redis_exporter:v1.52.0
    container_name: conectate-redis-exporter
    restart: unless-stopped
    ports:
      - "9121:9121"
    environment:
      - REDIS_ADDR=redis://redis:6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    networks:
      - monitoring
      - conectate-network
    depends_on:
      - redis
    labels:
      - "prometheus.scrape=true"
      - "prometheus.port=9121"
      - "prometheus.job=redis-exporter"

  # 🔥 POSTGRES EXPORTER - Métricas de PostgreSQL
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.13.0
    container_name: conectate-postgres-exporter
    restart: unless-stopped
    ports:
      - "9187:9187"
    environment:
      - DATA_SOURCE_NAME=postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/conectate?sslmode=disable
    networks:
      - monitoring
      - conectate-network
    depends_on:
      - postgres
    labels:
      - "prometheus.scrape=true"
      - "prometheus.port=9187"
      - "prometheus.job=postgres-exporter"

  # 🔥 ANDROID METRICS EXPORTER - Métricas específicas de Android
  android-metrics-exporter:
    build:
      context: ./android-metrics-exporter
      dockerfile: Dockerfile
    container_name: conectate-android-metrics
    restart: unless-stopped
    ports:
      - "9200:9200"
    environment:
      - ANDROID_API_URL=${ANDROID_API_URL}
      - ANDROID_API_KEY=${ANDROID_API_KEY}
      - METRICS_INTERVAL=30s
    networks:
      - monitoring
    labels:
      - "prometheus.scrape=true"
      - "prometheus.port=9200"
      - "prometheus.job=android-metrics"

  # 🔥 LOKI - Agregación de logs
  loki:
    image: grafana/loki:2.9.0
    container_name: conectate-loki
    restart: unless-stopped
    ports:
      - "3100:3100"
    volumes:
      - ./loki/config:/etc/loki
      - loki-data:/loki
    command:
      - '--config.file=/etc/loki/local-config.yaml'
    networks:
      - monitoring
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3100/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # 🔥 PROMTAIL - Colección de logs
  promtail:
    image: grafana/promtail:2.9.0
    container_name: conectate-promtail
    restart: unless-stopped
    ports:
      - "9080:9080"
    volumes:
      - ./promtail/config:/etc/promtail
      - /var/log:/var/log:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    command:
      - '--config.file=/etc/promtail/config.yml'
    networks:
      - monitoring
    depends_on:
      - loki
    labels:
      - "prometheus.scrape=true"
      - "prometheus.port=9080"
      - "prometheus.job=promtail"

  # 🔥 THANOS QUERY - Query distribuido para HA
  thanos-query:
    image: quay.io/thanos/thanos:v0.33.0
    container_name: conectate-thanos-query
    restart: unless-stopped
    ports:
      - "10902:10902"
      - "9090:9090"
    volumes:
      - ./thanos/config:/etc/thanos
    command:
      - 'query'
      - '--http-address=0.0.0.0:9090'
      - '--query.replica-label=replica'
      - '--store=dnssrv+_grpc._tcp.prometheus'
      - '--store=dnssrv+_grpc._tcp.prometheus-2'
    networks:
      - monitoring
    depends_on:
      - prometheus

  # 🔥 THANOS COMPACTOR - Compresión de datos históricos
  thanos-compactor:
    image: quay.io/thanos/thanos:v0.33.0
    container_name: conectate-thanos-compactor
    restart: unless-stopped
    volumes:
      - ./thanos/config:/etc/thanos
      - thanos-data:/data
    command:
      - 'compact'
      - '--http-address=0.0.0.0:10902'
      - '--data-dir=/data'
      - '--objstore.config-file=/etc/thanos/objstore.yml'
      - '--retention.resolution.raw=30d'
      - '--retention.resolution.5m=30d'
      - '--retention.resolution.1h=90d'
      - '--retention.resolution.raw=15d'
    networks:
      - monitoring

  # 🔥 THANOS STORE - Store para long-term storage
  thanos-store:
    image: quay.io/thanos/thanos:v0.33.0
    container_name: conectate-thanos-store
    restart: unless-stopped
    ports:
      - "10901:10901"
    volumes:
      - ./thanos/config:/etc/thanos
      - thanos-data:/data
    command:
      - 'store'
      - '--http-address=0.0.0.0:10901'
      - '--data-dir=/data'
      - '--objstore.config-file=/etc/thanos/objstore.yml'
    networks:
      - monitoring

  # 🔥 JAEGER - Distributed tracing
  jaeger:
    image: jaegertracing/all-in-one:1.49
    container_name: conectate-jaeger
    restart: unless-stopped
    ports:
      - "16686:16686"
      - "14268:14268"
    environment:
      - COLLECTOR_OTLP_ENABLED=true
      - SPAN_STORAGE_TYPE=elasticsearch
      - ES_SERVER_URLS=http://elasticsearch:9200
      - ES_USERNAME=${ES_USERNAME}
      - ES_PASSWORD=${ES_PASSWORD}
    networks:
      - monitoring
      - conectate-network
    depends_on:
      - elasticsearch

  # 🔥 ELASTICSEARCH - Storage para tracing y logs
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    container_name: conectate-elasticsearch
    restart: unless-stopped
    ports:
      - "9200:9200"
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    networks:
      - monitoring
      - conectate-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # 🔥 KIBANA - Visualización de logs y tracing
  kibana:
    image: docker.elastic.co/kibana/kibana:8.11.0
    container_name: conectate-kibana
    restart: unless-stopped
    ports:
      - "5601:5601"
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    networks:
      - monitoring
      - conectate-network
    depends_on:
      - elasticsearch
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5601/api/status || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

# 🔥 VOLUMES - Volúmenes persistentes
volumes:
  prometheus-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /data/prometheus
  grafana-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /data/grafana
  alertmanager-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /data/alertmanager
  loki-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /data/loki
  thanos-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /data/thanos
  elasticsearch-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /data/elasticsearch

# 🔥 NETWORKS - Redes Docker
networks:
  monitoring:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
  conectate-network:
    external: true
