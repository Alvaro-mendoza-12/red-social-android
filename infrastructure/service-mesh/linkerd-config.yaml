    port: 8000
    targetPort: 8000
---
# 🔥 DEPLOYMENT - API V1 Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: conectate-api-v1
  namespace: conectate-linkerd
  labels:
    app: conectate-api
    version: v1
spec:
  replicas: 3
  selector:
    matchLabels:
      app: conectate-api
      version: v1
  template:
    metadata:
      labels:
        app: conectate-api
        version: v1
    spec:
      containers:
      - name: conectate-api
        image: conectate/api:v1.0.0
        ports:
        - containerPort: 8080
        env:
        - name: DATABASE_URL
          value: "postgresql://user:pass@postgres.conectate.local:5432/conectate"
        - name: REDIS_URL
          value: "redis://redis.conectate.local:6379"
        - name: ML_SERVICE_URL
          value: "http://conectate-ml-service.conectate-linkerd.svc.cluster.local:8000"
        - name: SERVICE_VERSION
          value: "v1"
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 15
          periodSeconds: 20
---
