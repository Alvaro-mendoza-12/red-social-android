    port: 3000
    targetPort: 3000
---
# 🔥 SERVER - ML Server Definition
apiVersion: v1
kind: Service
metadata:
  name: conectate-ml-service
  namespace: conectate-linkerd
  labels:
    app: conectate-ml
    version: v1
spec:
  selector:
    app: conectate-ml
    version: v1
  ports:
  - name: http
    port: 8000
    targetPort: 8000
---
# 🔥 SERVER - ML V2 Server Definition
apiVersion: v1
kind: Service
metadata:
  name: conectate-ml-v2-service
  namespace: conectate-linkerd
  labels:
    app: conectate-ml
    version: v2
spec:
  selector:
    app: conectate-ml
    version: v2
  ports:
