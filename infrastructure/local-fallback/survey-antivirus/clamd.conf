Foreground yes
User novvin
DatabaseDirectory /var/lib/clamav
TemporaryDirectory /tmp
PidFile /tmp/clamd.pid
TCPSocket 3310
TCPAddr 0.0.0.0
MaxThreads 1
MaxQueue 2
StreamMaxLength 4M
MaxFileSize 4M
MaxScanSize 16M
MaxRecursion 12
MaxFiles 1000
MaxScanTime 5000
AlertExceedsMax yes
AlertEncrypted yes
ReadTimeout 10
CommandReadTimeout 5
SendBufTimeout 500
ConcurrentDatabaseReload no
SelfCheck 60
ExitOnOOM yes
