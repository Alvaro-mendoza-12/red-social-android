# Dedicated general-storage daemon. TCP must remain on an internal Docker network.
Foreground yes
User novvin
DatabaseDirectory /var/lib/clamav
TemporaryDirectory /tmp
PidFile /tmp/clamd.pid
TCPSocket 3310
TCPAddr 0.0.0.0
LogTime yes
LogClean no
StreamMaxLength 500M
MaxFileSize 500M
MaxScanSize 1000M
MaxScanTime 120000
MaxThreads 2
MaxQueue 4
MaxRecursion 16
MaxFiles 10000
AlertExceedsMax yes
AlertEncrypted yes
ScanArchive yes
ScanPE yes
ScanOLE2 yes
ScanPDF yes
ScanHTML yes
ScanXMLDOCS yes
ScanHWP3 yes
CommandReadTimeout 15
ReadTimeout 30
SendBufTimeout 15
IdleTimeout 30
ConcurrentDatabaseReload no
SelfCheck 60
ExitOnOOM yes
