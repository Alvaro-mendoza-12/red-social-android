name = "novvin-media-delivery"
main = "worker.mjs"
compatibility_date = "2026-11-02"
workers_dev = false
preview_urls = false

[[r2_buckets]]
binding = "MEDIA"
bucket_name = "novvin-media"

# An account without a proxied DNS zone can use workers_dev = true above.
# Pin the trusted Ubuntu HTTPS origin and enable the corresponding client setting.
# [vars]
# MEDIA_UPSTREAM_ORIGIN = "https://api.example.com"

# Use a proxied API hostname whose origin is already verified. Apply this route
# only after the backend and Worker agree on the private probe secret and target.
# [[routes]]
# pattern = "api.example.com/storage/v1/object/*"
# zone_name = "example.com"
