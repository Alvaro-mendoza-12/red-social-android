map $http_upgrade $connection_upgrade {
  default upgrade;
  '' close;
}

map $arg_affinity $signaling_affinity_key {
  '' $binary_remote_addr;
  "~^.{1,192}$" $arg_affinity;
  default $binary_remote_addr;
}

# Cloudflare Tunnel supplies the original public client address here. The edge
# port is bound to loopback only, so downstream services never trust a public
# client-provided X-Forwarded-For chain.
map $http_cf_connecting_ip $novvin_client_ip {
  '' $remote_addr;
  default $http_cf_connecting_ip;
}

map $http_x_forwarded_proto $novvin_forwarded_proto {
  default $scheme;
  'http' http;
  'https' https;
}

# Never write signed query parameters, bearer-like URL tokens, client IPs,
# referrers or user agents to the edge access log. `$uri` intentionally omits
# `$args`; timing/status/byte fields retain the operational signal we need.
log_format novvin_safe
  '$time_iso8601 request_id=$request_id method=$request_method uri=$uri '
  'status=$status bytes=$body_bytes_sent request_time=$request_time '
  'upstream_time=$upstream_response_time upstream_status=$upstream_status';

resolver 127.0.0.11 valid=5s ipv6=off;

upstream novvin_signaling_cluster {
  zone novvin_signaling_cluster 64k;
  hash $signaling_affinity_key consistent;
  server signaling:3003 resolve;
  keepalive 64;
}

server {
  listen 8080;
  server_name _;
  client_max_body_size 512m;
  sendfile on;
  tcp_nopush on;
  open_file_cache max=10000 inactive=60s;
  open_file_cache_valid 30s;
  open_file_cache_min_uses 2;
  open_file_cache_errors off;
  # Compress API metadata, not media bytes. Feed/profile/social JSON benefits
  # substantially on mobile networks while video/audio Range responses remain
  # untouched because their MIME types are deliberately absent.
  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_types application/json application/javascript text/css text/plain text/xml;
  access_log /var/log/nginx/access.log novvin_safe;

  set $api_upstream http://conectate-local-fallback-api-main:3001;
  set $realtime_upstream http://conectate-local-fallback-realtime-main:3002;

  proxy_http_version 1.1;
  proxy_read_timeout 3600s;
  proxy_send_timeout 3600s;

  location /socket.io/ {
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $novvin_client_ip;
    proxy_set_header X-Forwarded-For $novvin_client_ip;
    proxy_set_header X-Forwarded-Proto $novvin_forwarded_proto;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_pass http://novvin_signaling_cluster;
  }

  location /call/socket.io/ {
    rewrite ^/call/socket.io/(.*)$ /socket.io/$1 break;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $novvin_client_ip;
    proxy_set_header X-Forwarded-For $novvin_client_ip;
    proxy_set_header X-Forwarded-Proto $novvin_forwarded_proto;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_pass http://novvin_signaling_cluster;
  }

  location /live/socket.io/ {
    rewrite ^/live/socket.io/(.*)$ /socket.io/$1 break;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $novvin_client_ip;
    proxy_set_header X-Forwarded-For $novvin_client_ip;
    proxy_set_header X-Forwarded-Proto $novvin_forwarded_proto;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_pass http://novvin_signaling_cluster;
  }

  location = /turn-credentials {
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $novvin_client_ip;
    proxy_set_header X-Forwarded-For $novvin_client_ip;
    proxy_set_header X-Forwarded-Proto $novvin_forwarded_proto;
    proxy_pass http://novvin_signaling_cluster;
  }

  location = /live-active-ids {
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $novvin_client_ip;
    proxy_set_header X-Forwarded-For $novvin_client_ip;
    proxy_set_header X-Forwarded-Proto $novvin_forwarded_proto;
    proxy_pass http://novvin_signaling_cluster;
  }

  location ^~ /realtime/internal/ {
    return 404;
  }

  # The API authorizes every object and returns X-Accel-Redirect. This path is
  # unreachable from public requests; Nginx only moves the already-approved
  # bytes from the read-only media volume and natively serves Range requests.
  location ^~ /_novvin_storage/ {
    internal;
    alias /data/storage/;
  }

  location /realtime/ {
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $novvin_client_ip;
    proxy_set_header X-Forwarded-For $novvin_client_ip;
    proxy_set_header X-Forwarded-Proto $novvin_forwarded_proto;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    rewrite ^/realtime/?(.*)$ /$1 break;
    proxy_pass $realtime_upstream;
  }

  location ^~ /storage/v1/object/ {
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $novvin_client_ip;
    proxy_set_header X-Forwarded-For $novvin_client_ip;
    proxy_set_header X-Forwarded-Proto $novvin_forwarded_proto;
    proxy_set_header Connection "";
    proxy_socket_keepalive on;
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_max_temp_file_size 0;
    proxy_pass $api_upstream;
  }

  # TUS chunks and the legacy multipart endpoint must flow directly to the
  # API. Buffering here would write every upload twice (edge temp + storage
  # temp), delay progress and amplify pressure on the system SSD.
  location ^~ /storage/v1/upload/resumable {
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $novvin_client_ip;
    proxy_set_header X-Forwarded-For $novvin_client_ip;
    proxy_set_header X-Forwarded-Proto $novvin_forwarded_proto;
    proxy_set_header Connection "";
    proxy_socket_keepalive on;
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_max_temp_file_size 0;
    proxy_pass $api_upstream;
  }

  location = /v1/storage/upload {
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $novvin_client_ip;
    proxy_set_header X-Forwarded-For $novvin_client_ip;
    proxy_set_header X-Forwarded-Proto $novvin_forwarded_proto;
    proxy_set_header Connection "";
    proxy_socket_keepalive on;
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_max_temp_file_size 0;
    proxy_pass $api_upstream;
  }

  location / {
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $novvin_client_ip;
    proxy_set_header X-Forwarded-For $novvin_client_ip;
    proxy_set_header X-Forwarded-Proto $novvin_forwarded_proto;
    proxy_set_header Connection "";
    proxy_socket_keepalive on;
    proxy_pass $api_upstream;
  }
}
