# NOVVIN Ubuntu Local-Fallback Stack — Prometheus Scrape Configuration
# Mount secret files (read-only) containing REALTIME_INTERNAL_SECRET and LIVE_INTERNAL_EVENTS_TOKEN
# or point bearer_token_file / authorization.credentials_file to the host secret path.

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s
  external_labels:
    service_stack: "novvin-ubuntu-local-fallback"

rule_files:
  - "/etc/prometheus/alerts.novvin.yml"

scrape_configs:
  - job_name: "novvin-api"
    metrics_path: "/internal/metrics"
    authorization:
      type: "Bearer"
      credentials_file: "/run/secrets/realtime_internal_secret"
    static_configs:
      - targets: ["api:3001"]
        labels:
          component: "api"

  - job_name: "novvin-realtime-gateway"
    metrics_path: "/internal/metrics"
    authorization:
      type: "Bearer"
      credentials_file: "/run/secrets/realtime_internal_secret"
    static_configs:
      - targets: ["realtime-gateway:3002"]
        labels:
          component: "realtime-gateway"

  - job_name: "novvin-signaling"
    metrics_path: "/internal/metrics"
    authorization:
      type: "Bearer"
      credentials_file: "/run/secrets/live_internal_events_token"
    static_configs:
      - targets: ["signaling:3003"]
        labels:
          component: "signaling"
