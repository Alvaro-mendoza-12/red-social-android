services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: conectate_fallback
      POSTGRES_USER: conectate
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:${FALLBACK_DB_PORT:-5433}:5432"
    volumes:
      - conectate-fallback-db:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U conectate -d conectate_fallback"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgres://conectate:${POSTGRES_PASSWORD}@db:5432/conectate_fallback
      STORAGE_ROOT: /data/storage
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
    volumes:
      - ./imports:/imports:ro
      - conectate-fallback-storage:/data/storage
    ports:
      - "127.0.0.1:${FALLBACK_API_PORT:-3001}:3001"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  conectate-fallback-db:
    name: conectate-fallback-db
  conectate-fallback-storage:
    name: conectate-fallback-storage
