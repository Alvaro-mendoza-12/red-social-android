# 🔥 CONÉCTATE STATIC ANALYSIS CONFIGURATION - CONFIGURACIÓN COMPLETA
# Configuración ultra-estricta para análisis estático 100% realista
# Implementación con mejores prácticas enterprise y herramientas profesionales
#
# Características implementadas:
# 1. Detekt - Análisis estático Kotlin
# 2. SonarQube - Análisis de calidad de código
# 3. PMD - Análisis de código Java
# 4. Checkstyle - Verificación de estilo de código
# 5. SpotBugs - Detección de bugs
# 6. Android Lint - Lint específico de Android
# 7. Ktlint - Formato de código Kotlin
# 8. ErrorProne - Detección de errores comunes
# 9. NullAway - Análisis de nullability
# 10. JaCoCo - Cobertura de código

name: Static Analysis Pipeline
on:
  push:
    branches: [ main, develop, feature/* ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    - cron: '0 2 * * *' # Daily at 2 AM

jobs:
  # 🔥 DETEKT ANALYSIS - Análisis estático con Detekt
  detekt-analysis:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Cache Gradle packages
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Run Detekt analysis
        run: |
          ./gradlew detekt --stacktrace

      - name: Upload Detekt results
        uses: actions/upload-artifact@v3
        with:
          name: detekt-report
          path: build/reports/detekt/detekt.xml
        if: always()

      - name: Detekt PR Comment
        uses: detekt/action@v1.0.0
        if: github.event_name == 'pull_request'
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          report_path: build/reports/detekt/detekt.xml

  # 🔥 SONARQUBE ANALYSIS - Análisis de calidad con SonarQube
  sonarqube-analysis:
    runs-on: ubuntu-latest
    needs: detekt-analysis
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Cache Gradle packages
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Run tests with coverage
        run: |
          ./gradlew testDebugUnitTest jacocoTestReport --stacktrace

      - name: Run SonarQube analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ./gradlew sonarqube \
            -Dsonar.projectKey=conectate-android \
            -Dsonar.organization=conectate \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.login=$SONAR_TOKEN \
            -Dsonar.github.token=$GITHUB_TOKEN \
            -Dsonar.github.repository=${{ github.repository }} \
            -Dsonar.github.oauth=$GITHUB_TOKEN

      - name: SonarQube Quality Gate
        uses: sonarsource/sonarqube-quality-gate-action@master
        if: always()
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  # 🔥 PMD ANALYSIS - Análisis de código con PMD
  pmd-analysis:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Run PMD analysis
        run: |
          ./gradlew pmdMain pmdTest --stacktrace

      - name: Upload PMD results
        uses: actions/upload-artifact@v3
        with:
          name: pmd-report
          path: build/reports/pmd/
        if: always()

  # 🔥 CHECKSTYLE ANALYSIS - Análisis de estilo con Checkstyle
  checkstyle-analysis:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Run Checkstyle analysis
        run: |
          ./gradlew checkstyleMain checkstyleTest --stacktrace

      - name: Upload Checkstyle results
        uses: actions/upload-artifact@v3
        with:
          name: checkstyle-report
          path: build/reports/checkstyle/
        if: always()

  # 🔥 SPOTBUGS ANALYSIS - Detección de bugs con SpotBugs
  spotbugs-analysis:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Run SpotBugs analysis
        run: |
          ./gradlew spotbugsMain spotbugsTest --stacktrace

      - name: Upload SpotBugs results
        uses: actions/upload-artifact@v3
        with:
          name: spotbugs-report
          path: build/reports/spotbugs/
        if: always()

  # 🔥 ANDROID LINT ANALYSIS - Análisis Lint específico de Android
  android-lint-analysis:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Run Android Lint analysis
        run: |
          ./gradlew lintDebug lintRelease --stacktrace

      - name: Upload Android Lint results
        uses: actions/upload-artifact@v3
        with:
          name: android-lint-report
          path: build/reports/lint/
        if: always()

  # 🔥 KTLINT ANALYSIS - Formato de código Kotlin
  ktlint-analysis:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Run KtLint analysis
        run: |
          ./gradlew ktlintCheck --stacktrace

      - name: Upload KtLint results
        uses: actions/upload-artifact@v3
        with:
          name: ktlint-report
          path: build/reports/ktlint/
        if: always()

  # 🔥 ERRORPRONE ANALYSIS - Detección de errores comunes
  errorprone-analysis:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Run ErrorProne analysis
        run: |
          ./gradlew compileDebugJavaWithJavac --stacktrace

      - name: Upload ErrorProne results
        uses: actions/upload-artifact@v3
        with:
          name: errorprone-report
          path: build/reports/errorprone/
        if: always()

  # 🔥 NULLAWAY ANALYSIS - Análisis de nullability
  nullaway-analysis:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Run NullAway analysis
        run: |
          ./gradlew compileDebugJavaWithJavac --stacktrace

      - name: Upload NullAway results
        uses: actions/upload-artifact@v3
        with:
          name: nullaway-report
          path: build/reports/nullaway/
        if: always()

  # 🔥 JACOCO COVERAGE - Cobertura de código con JaCoCo
  jacoco-coverage:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Run tests with JaCoCo
        run: |
          ./gradlew testDebugUnitTest jacocoTestReport --stacktrace

      - name: Upload JaCoCo results
        uses: actions/upload-artifact@v3
        with:
          name: jacoco-report
          path: build/reports/jacoco/
        if: always()

      - name: Coverage comment
        uses: madrapps/jacoco-report@v1.3
        if: github.event_name == 'pull_request'
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          jacocoXmlPath: build/reports/jacoco/jacocoTestReport/jacocoTestReport.xml
          min-coverage-overall: 85.0
          min-coverage-changed-files: 90.0

  # 🔥 QUALITY GATE - Gate de calidad final
  quality-gate:
    runs-on: ubuntu-latest
    needs: [detekt-analysis, sonarqube-analysis, pmd-analysis, checkstyle-analysis, spotbugs-analysis, android-lint-analysis, ktlint-analysis, errorprone-analysis, nullaway-analysis, jacoco-coverage]
    if: always()
    steps:
      - name: Quality Gate Summary
        run: |
          echo "🔥 CONÉCTATE CODE QUALITY GATE SUMMARY"
          echo "========================================"
          echo "✅ Detekt Analysis: ${{ needs.detekt-analysis.result }}"
          echo "✅ SonarQube Analysis: ${{ needs.sonarqube-analysis.result }}"
          echo "✅ PMD Analysis: ${{ needs.pmd-analysis.result }}"
          echo "✅ Checkstyle Analysis: ${{ needs.checkstyle-analysis.result }}"
          echo "✅ SpotBugs Analysis: ${{ needs.spotbugs-analysis.result }}"
          echo "✅ Android Lint Analysis: ${{ needs.android-lint-analysis.result }}"
          echo "✅ KtLint Analysis: ${{ needs.ktlint-analysis.result }}"
          echo "✅ ErrorProne Analysis: ${{ needs.errorprone-analysis.result }}"
          echo "✅ NullAway Analysis: ${{ needs.nullaway-analysis.result }}"
          echo "✅ JaCoCo Coverage: ${{ needs.jacoco-coverage.result }}"
          echo "========================================"
          
          # Check if all jobs passed
          if [[ "${{ needs.detekt-analysis.result }}" == "failure" || \
                "${{ needs.sonarqube-analysis.result }}" == "failure" || \
                "${{ needs.pmd-analysis.result }}" == "failure" || \
                "${{ needs.checkstyle-analysis.result }}" == "failure" || \
                "${{ needs.spotbugs-analysis.result }}" == "failure" || \
                "${{ needs.android-lint-analysis.result }}" == "failure" || \
                "${{ needs.ktlint-analysis.result }}" == "failure" || \
                "${{ needs.errorprone-analysis.result }}" == "failure" || \
                "${{ needs.nullaway-analysis.result }}" == "failure" || \
                "${{ needs.jacoco-coverage.result }}" == "failure" ]]; then
            echo "❌ QUALITY GATE FAILED"
            exit 1
          else
            echo "✅ QUALITY GATE PASSED"
            echo "🚀 Code meets ultra-high quality standards!"
          fi

  # 🔥 SECURITY SCAN - Escaneo de seguridad adicional
  security-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v2
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

      - name: Run OWASP dependency check
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: 'conectate-android'
          path: '.'
          format: 'HTML'
          out: 'dependency-check-report'

      - name: Upload OWASP results
        uses: actions/upload-artifact@v3
        with:
          name: dependency-check-report
          path: dependency-check-report/
        if: always()
