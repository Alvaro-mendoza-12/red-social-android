# 🔥 CONÉCTATE CODE QUALITY GATES - SONARQUBE CONFIGURATION
# Configuración ultra-estricta para código 100% limpio y escalable
# Implementación 100% realista con mejores prácticas enterprise
#
# Características implementadas:
# 1. Code Coverage - Cobertura de código mínima
# 2. Code Quality - Calidad de código máxima
# 3. Security Quality - Calidad de seguridad
# 4. Maintainability - Mantenibilidad
# 5. Reliability - Fiabilidad
# 6. Technical Debt - Deuda técnica mínima
# 7. Duplicated Code - Código duplicado
# 8. Complexity - Complejidad controlada
# 9. Documentation - Documentación completa
# 10. Testing - Testing exhaustivo

# 🔥 PROJECT CONFIGURATION - Configuración del proyecto
sonar.projectKey=conectate-android
sonar.projectName=Conectate Android App
sonar.projectVersion=2.1.7

# 🔥 SOURCE CONFIGURATION - Configuración de fuentes
sonar.sources=src/main/java,src/main/kotlin
sonar.tests=src/test/java,src/test/kotlin,src/androidTest/java,src/androidTest/kotlin
sonar.inclusions=**/*.java,**/*.kt,**/*.xml
sonar.exclusions=**/build/**,**/generated/**,**/test/**,**/androidTest/**,**/R.java,**/R.kt,**/BuildConfig.java,**/BuildConfig.kt,**/Manifest.java,**/Manifest.kt

# 🔥 LANGUAGE CONFIGURATION - Configuración de lenguajes
sonar.java.source=17
sonar.java.target=17
sonar.kotlin.file.suffixes=.kt,.kts

# 🔥 CODE COVERAGE GATES - Gates de cobertura de código
sonar.coverage.jacoco.xmlReportPaths=build/reports/jacoco/jacocoTestReport/jacocoTestReport.xml
sonar.unitTest.inclusions=**/*Test*.java,**/*Test*.kt
sonar.unitTest.exclusions=**/androidTest/**,**/test/**,**/R.java,**/R.kt,**/BuildConfig.java,**/BuildConfig.kt

# 🔥 QUALITY GATES - Gates de calidad ultra-estrictos
sonar.qualitygate.wait=true

# 🔥 COVERAGE REQUIREMENTS - Requisitos de cobertura
sonar.coverage.exclusions=**/R.java,**/R.kt,**/BuildConfig.java,**/BuildConfig.kt,**/Manifest.java,**/Manifest.kt,**/di/**,**/Dagger*.*,**/*_Factory.*,**/*_MembersInjector.*,**/*Module*.*,**/Hilt_*.*
sonar.coverage.minimum=85.0
sonar.newCoverage.minimum=90.0

# 🔥 DUPLICATION REQUIREMENTS - Requisitos de duplicación
sonar.cpd.exclusions=**/test/**,**/androidTest/**,**/generated/**,**/build/**,**/R.java,**/R.kt,**/BuildConfig.java,**/BuildConfig.kt
sonar.duplications.minimum=3
sonar.duplications.minimum=95.0
sonar.newDuplications.minimum=97.0

# 🔥 COMPLEXITY REQUIREMENTS - Requisitos de complejidad
sonar.complexity.minimum=1
sonar.complexity.maximum=15
sonar.complexity.qualified.minimum=1
sonar.complexity.qualified.maximum=10

# 🔥 MAINTAINABILITY REQUIREMENTS - Requisitos de mantenibilidad
sonar.sqale.rating=A
sonar.sqale.debtRatio=0.0
sonar.sqale.remediationCost=0.0

# 🔥 RELIABILITY REQUIREMENTS - Requisitos de fiabilidad
sonar.reliability.rating=A
sonar.reliability.issues=0

# 🔥 SECURITY REQUIREMENTS - Requisitos de seguridad
sonar.security.rating=A
sonar.security.issues=0
sonar.security.hotspots=0

# 🔥 TECHNICAL DEBT REQUIREMENTS - Requisitos de deuda técnica
sonar.technicalDebt.hours=0.0
sonar.technicalDebt.ratio=0.0
sonar.newTechnicalDebt.hours=0.0
sonar.newTechnicalDebt.ratio=0.0

# 🔥 SIZE REQUIREMENTS - Requisitos de tamaño
sonar.size.metric=ncloc
sonar.size.maximum=100000
sonar.newSize.metric=ncloc
sonar.newSize.maximum=1000

# 🔥 ISSUES REQUIREMENTS - Requisitos de issues
sonar.issues.blocker=0
sonar.issues.critical=0
sonar.issues.major=0
sonar.issues.minor=0
sonar.issues.info=0

# 🔥 NEW ISSUES REQUIREMENTS - Requisitos de nuevos issues
sonar.newIssues.blocker=0
sonar.newIssues.critical=0
sonar.newIssues.major=0
sonar.newIssues.minor=0
sonar.newIssues.info=0

# 🔥 CUSTOM RULES - Reglas personalizadas ultra-estrictas
sonar.java.codeCoveragePlugin.reportPaths=build/reports/jacoco/jacocoTestReport/jacocoTestReport.xml
sonar.kotlin.coverage.plugin.reportPaths=build/reports/jacoco/jacocoTestReport/jacocoTestReport.xml

# 🔥 EXTERNAL TOOLS INTEGRATION - Integración con herramientas externas
sonar.externalIssuesReportPaths=build/reports/external-issues/
sonar.importExternalIssues=true

# 🔥 ANALYSIS PARAMETERS - Parámetros de análisis
sonar.analysis.mode=preview
sonar.issuesReport.html.enable=true
sonar.issuesReport.txt.enable=true
sonar.issuesReport.xml.enable=true

# 🔥 SCM INTEGRATION - Integración con SCM
sonar.scm.provider=git
sonar.scm.revision=HEAD
sonar.scm.exclusions.disabled=true

# 🔥 NOTIFICATION SETTINGS - Configuración de notificaciones
sonar.notifications.enabled=true
sonar.notifications.email.enabled=true
sonar.notifications.webhook.enabled=true

# 🔥 SECURITY HOTSPOTS - Hotspots de seguridad
sonar.security.hotspots.enabled=true
sonar.security.hotspots.reviewPriority=high
sonar.security.hotspots.newReviewPriority=high

# 🔥 LANGUAGES SPECIFIC - Configuración específica por lenguaje
sonar.java.binaries=build/intermediates/javac/debug/compileDebugJavaWithJavac/classes
sonar.java.libraries=build/intermediates/compile_and_runtime_not_namespaced_r_jar/classes.jar
sonar.kotlin.binaries=build/tmp/kotlin-classes/debug

# 🔥 TEST EXECUTION - Ejecución de tests
sonar.junit.reportsPath=build/test-results/testDebugUnitTest
sonar.junit.reportPaths=build/test-results/testDebugUnitTest
sonar.android.junit.reportPaths=build/test-results/testDebugUnitTest

# 🔥 ADDITIONAL PROPERTIES - Propiedades adicionales para ultra-calidad
sonar.sourceEncoding=UTF-8
sonar.java.source=17
sonar.java.target=17
sonar.java.binaries=build/intermediates/javac/debug/compileDebugJavaWithJavac/classes
sonar.java.libraries=build/intermediates/compile_and_runtime_not_namespaced_r_jar/classes.jar

# 🔥 PERFORMANCE SETTINGS - Configuración de rendimiento
sonar.java.parsing.maxMemory=2048
sonar.kotlin.parsing.maxMemory=2048
sonar.analysis.maxMemory=4096

# 🔥 EXCLUSIONS AND INCLUSIONS - Exclusiones e inclusiones específicas
sonar.exclusions=**/build/**,**/generated/**,**/test/**,**/androidTest/**,**/R.java,**/R.kt,**/BuildConfig.java,**/BuildConfig.kt,**/Manifest.java,**/Manifest.kt,**/di/**,**/Dagger*.*,**/*_Factory.*,**/*_MembersInjector.*,**/*Module*.*,**/Hilt_*.*
sonar.inclusions=**/*.java,**/*.kt,**/*.xml

# 🔥 QUALITY PROFILES - Perfiles de calidad
sonar.java.qualityprofile=conectate-android-quality
sonar.kotlin.qualityprofile=conectate-android-quality

# 🔥 CUSTOM METRICS - Métricas personalizadas
sonar.custom.metrics=complexity,coverage,duplications,maintainability,reliability,security

# 🔥 GATE CONDITIONS - Condiciones de gates
sonar.gate.condition.coverage=85.0
sonar.gate.condition.newCoverage=90.0
sonar.gate.condition.duplications=95.0
sonar.gate.condition.newDuplications=97.0
sonar.gate.condition.maintainability=A
sonar.gate.condition.reliability=A
sonar.gate.condition.security=A
sonar.gate.condition.technicalDebt=0.0
sonar.gate.condition.newTechnicalDebt=0.0
