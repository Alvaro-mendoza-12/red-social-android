# 🔥 CONÉCTATE API DOCUMENTATION - OPENAPI 3.0 SPECIFICATION
# Documentación API basada en OpenAPI 3.0 con mejores prácticas
# Implementación 100% realista con especificación completa y ejemplos

openapi: 3.0.3
info:
  title: Conectate API
  description: |
    ## API RESTful de Conectate
    
    Esta API proporciona acceso a todas las funcionalidades de la plataforma Conectate,
    incluyendo gestión de usuarios, contenido, streaming, machine learning y más.
    
    ### Características principales:
    - **Autenticación JWT** con refresh tokens
    - **Rate limiting** configurable por endpoint
    - **CORS** habilitado para dominios autorizados
    - **Versioning** de API semántico
    - **Documentación** interactiva con Swagger UI
    - **Testing** con ejemplos incluidos
    - **Seguridad** enterprise con Zero Trust
    
    ### Base URL:
    - **Producción**: `https://api.conectate.com/v1`
    - **Staging**: `https://staging-api.conectate.com/v1`
    - **Desarrollo**: `https://dev-api.conectate.com/v1`
    
    ### Contacto:
    - **Email**: api@conectate.com
    - **Soporte**: support@conectate.com
    - **Documentación**: https://docs.conectate.com
    - **Status**: https://status.conectate.com
  version: 1.0.0
  contact:
    name: Conectate API Team
    email: api@conectate.com
    url: https://conectate.com
  license:
    name: MIT License
    url: https://opensource.org/licenses/MIT
  termsOfService: https://conectate.com/terms
  x-logo:
    url: https://conectate.com/logo.png
    backgroundColor: "#FFFFFF"
    altText: "Conectate Logo"

# 🔥 SERVERS - Servidores disponibles
servers:
  - url: https://api.conectate.com/v1
    description: Servidor de producción
    variables:
      version:
        enum: [v1, v2]
        default: v1
        description: Versión de la API
  - url: https://staging-api.conectate.com/v1
    description: Servidor de staging
  - url: https://dev-api.conectate.com/v1
    description: Servidor de desarrollo

# 🔥 TAGS - Agrupación de endpoints
tags:
  - name: Authentication
    description: Operaciones de autenticación y gestión de sesiones
    externalDocs:
      description: Guía de autenticación
      url: https://docs.conectate.com/auth
  - name: Users
    description: Gestión de usuarios y perfiles
    externalDocs:
      description: Guía de usuarios
      url: https://docs.conectate.com/users
  - name: Content
    description: Gestión de contenido y posts
    externalDocs:
      description: Guía de contenido
      url: https://docs.conectate.com/content
  - name: Streaming
    description: Streaming en tiempo real y video
    externalDocs:
      description: Guía de streaming
      url: https://docs.conectate.com/streaming
  - name: ML & AI
    description: Machine Learning y análisis predictivo
    externalDocs:
      description: Guía de ML
      url: https://docs.conectate.com/ml
  - name: Analytics
    description: Análisis y métricas
    externalDocs:
      description: Guía de analytics
      url: https://docs.conectate.com/analytics
  - name: Security
    description: Seguridad y biometría
    externalDocs:
      description: Guía de seguridad
      url: https://docs.conectate.com/security

# 🔥 PATHS - ENDPOINTS DE LA API
paths:
  # 🔥 AUTHENTICATION ENDPOINTS - Endpoints de autenticación
  /auth/login:
    post:
      tags: [Authentication]
      summary: Iniciar sesión de usuario
      description: Autentica un usuario con email y contraseña
      operationId: loginUser
      externalDocs:
        description: Guía de login
        url: https://docs.conectate.com/auth/login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            examples:
              loginValid:
                summary: Login válido
                value:
                  email: user@conectate.com
                  password: password123
                  rememberMe: true
              loginInvalid:
                summary: Login inválido
                value:
                  email: invalid@email.com
                  password: wrongpassword
      responses:
        '200':
          description: Login exitoso
          headers:
            Set-Cookie:
              description: Refresh token cookie
              schema:
                type: string
                example: refresh_token=abc123; HttpOnly; Secure; SameSite=Strict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
              examples:
                loginSuccess:
                  summary: Login exitoso
                  value:
                    success: true
                    data:
                      user:
                        id: "user_123"
                        email: "user@conectate.com"
                        firstName: "John"
                        lastName: "Doe"
                        avatar: "https://cdn.conectate.com/avatars/user_123.jpg"
                        verified: true
                        createdAt: "2024-01-01T00:00:00Z"
                      tokens:
                        accessToken: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
                        refreshToken: "refresh_token_abc123"
                        expiresIn: 3600
                        tokenType: "Bearer"
                    message: "Login successful"
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
      security: []
      x-rate-limit: 5/minute
      x-code-samples:
        - lang: 'JavaScript'
          label: 'JavaScript/Node.js'
          source: |
            const response = await fetch('https://api.conectate.com/v1/auth/login', {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json'
              },
              body: JSON.stringify({
                email: 'user@conectate.com',
                password: 'password123'
              })
            });
            const data = await response.json();
        - lang: 'Python'
          label: 'Python'
          source: |
            import requests
            
            response = requests.post(
                'https://api.conectate.com/v1/auth/login',
                json={
                    'email': 'user@conectate.com',
                    'password': 'password123'
                }
            )
            data = response.json()
        - lang: 'cURL'
          label: 'cURL'
          source: |
            curl -X POST "https://api.conectate.com/v1/auth/login" \
              -H "Content-Type: application/json" \
              -d '{
                "email": "user@conectate.com",
                "password": "password123"
              }'

  /auth/register:
    post:
      tags: [Authentication]
      summary: Registrar nuevo usuario
      description: Crea una nueva cuenta de usuario
      operationId: registerUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
            examples:
              registerValid:
                summary: Registro válido
                value:
                  email: newuser@conectate.com
                  password: password123
                  firstName: "John"
                  lastName: "Doe"
                  acceptTerms: true
                  acceptPrivacy: true
      responses:
        '201':
          description: Usuario creado exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterResponse'
              examples:
                registerSuccess:
                  summary: Registro exitoso
                  value:
                    success: true
                    data:
                      user:
                        id: "user_456"
                        email: "newuser@conectate.com"
                        firstName: "John"
                        lastName: "Doe"
                        avatar: null
                        verified: false
                        createdAt: "2024-01-01T00:00:00Z"
                      verificationToken: "verify_token_abc123"
                    message: "User registered successfully. Please check your email."
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          description: El usuario ya existe
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                userExists:
                  summary: Usuario ya existe
                  value:
                    success: false
                    error:
                      code: "USER_EXISTS"
                      message: "User with this email already exists"
                      details: "An account with email newuser@conectate.com already exists"
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
      security: []
      x-rate-limit: 3/minute

  /auth/refresh:
    post:
      tags: [Authentication]
      summary: Refrescar token de acceso
      description: Genera un nuevo access token usando el refresh token
      operationId: refreshToken
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
            examples:
              refreshValid:
                summary: Refresh válido
                value:
                  refreshToken: "refresh_token_abc123"
      responses:
        '200':
          description: Token refrescado exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefreshTokenResponse'
              examples:
                refreshSuccess:
                  summary: Refresh exitoso
                  value:
                    success: true
                    data:
                      accessToken: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
                      expiresIn: 3600
                      tokenType: "Bearer"
                    message: "Token refreshed successfully"
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
      security: []

  /auth/logout:
    post:
      tags: [Authentication]
      summary: Cerrar sesión
      description: Cierra la sesión del usuario actual
      operationId: logoutUser
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Sesión cerrada exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogoutResponse'
              examples:
                logoutSuccess:
                  summary: Logout exitoso
                  value:
                    success: true
                    message: "Logged out successfully"
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  # 🔥 USER ENDPOINTS - Endpoints de usuarios
  /users/me:
    get:
      tags: [Users]
      summary: Obtener perfil del usuario actual
      description: Recupera la información del perfil del usuario autenticado
      operationId: getCurrentUser
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Perfil de usuario obtenido exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
              examples:
                userProfile:
                  summary: Perfil de usuario
                  value:
                    success: true
                    data:
                      id: "user_123"
                      email: "user@conectate.com"
                      firstName: "John"
                      lastName: "Doe"
                      avatar: "https://cdn.conectate.com/avatars/user_123.jpg"
                      bio: "Software developer passionate about technology"
                      location: "San Francisco, CA"
                      website: "https://johndoe.com"
                      verified: true
                      followers: 1250
                      following: 890
                      posts: 156
                      createdAt: "2024-01-01T00:00:00Z"
                      updatedAt: "2024-01-15T10:30:00Z"
                      preferences:
                        theme: "dark"
                        language: "en"
                        notifications:
                          email: true
                          push: true
                          sms: false
                        privacy:
                          profileVisibility: "public"
                          showOnlineStatus: true
                          allowDirectMessages: true
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

    put:
      tags: [Users]
      summary: Actualizar perfil del usuario
      description: Actualiza la información del perfil del usuario autenticado
      operationId: updateCurrentUser
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserRequest'
            examples:
              updateProfile:
                summary: Actualizar perfil
                value:
                  firstName: "John"
                  lastName: "Smith"
                  bio: "Updated bio"
                  location: "New York, NY"
                  website: "https://johnsmith.com"
                  preferences:
                    theme: "light"
                    notifications:
                      email: false
                      push: true
      responses:
        '200':
          description: Perfil actualizado exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
              examples:
                profileUpdated:
                  summary: Perfil actualizado
                  value:
                    success: true
                    data:
                      id: "user_123"
                      email: "user@conectate.com"
                      firstName: "John"
                      lastName: "Smith"
                      bio: "Updated bio"
                      location: "New York, NY"
                      website: "https://johnsmith.com"
                      updatedAt: "2024-01-20T14:30:00Z"
                    message: "Profile updated successfully"
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /users/{userId}:
    get:
      tags: [Users]
      summary: Obtener perfil de usuario específico
      description: Recupera la información pública de un usuario específico
      operationId: getUserById
      parameters:
        - name: userId
          in: path
          required: true
          description: ID del usuario
          schema:
            type: string
            format: uuid
            example: "user_123"
      responses:
        '200':
          description: Perfil de usuario obtenido exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicUserProfile'
              examples:
                publicProfile:
                  summary: Perfil público
                  value:
                    success: true
                    data:
                      id: "user_123"
                      firstName: "John"
                      lastName: "Doe"
                      avatar: "https://cdn.conectate.com/avatars/user_123.jpg"
                      bio: "Software developer passionate about technology"
                      location: "San Francisco, CA"
                      website: "https://johndoe.com"
                      verified: true
                      followers: 1250
                      following: 890
                      posts: 156
                      createdAt: "2024-01-01T00:00:00Z"
        '404':
          description: Usuario no encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                userNotFound:
                  summary: Usuario no encontrado
                  value:
                    success: false
                    error:
                      code: "USER_NOT_FOUND"
                      message: "User not found"
                      details: "User with ID user_123 does not exist"
        '500':
          $ref: '#/components/responses/InternalServerError'

  # 🔥 CONTENT ENDPOINTS - Endpoints de contenido
  /posts:
    get:
      tags: [Content]
      summary: Obtener lista de posts
      description: Recupera una lista paginada de posts
      operationId: getPosts
      parameters:
        - name: page
          in: query
          description: Número de página
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          description: Límite de resultados por página
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: sort
          in: query
          description: Campo de ordenamiento
          schema:
            type: string
            enum: [createdAt, updatedAt, likes, comments]
            default: createdAt
        - name: order
          in: query
          description: Dirección de ordenamiento
          schema:
            type: string
            enum: [asc, desc]
            default: desc
        - name: tag
          in: query
          description: Filtrar por tag
          schema:
            type: string
            example: "technology"
        - name: author
          in: query
          description: Filtrar por autor
          schema:
            type: string
            format: uuid
            example: "user_123"
      responses:
        '200':
          description: Lista de posts obtenida exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostsResponse'
              examples:
                postsList:
                  summary: Lista de posts
                  value:
                    success: true
                    data:
                      posts:
                        - id: "post_123"
                          title: "Introduction to Machine Learning"
                          content: "Machine learning is a subset of artificial intelligence..."
                          author:
                            id: "user_123"
                            firstName: "John"
                            lastName: "Doe"
                            avatar: "https://cdn.conectate.com/avatars/user_123.jpg"
                          tags: ["machine-learning", "ai", "technology"]
                          likes: 42
                          comments: 8
                          shares: 3
                          createdAt: "2024-01-15T10:30:00Z"
                          updatedAt: "2024-01-15T10:30:00Z"
                      pagination:
                        page: 1
                        limit: 20
                        total: 156
                        totalPages: 8
                        hasNext: true
                        hasPrev: false
        '500':
          $ref: '#/components/responses/InternalServerError'

    post:
      tags: [Content]
      summary: Crear nuevo post
      description: Crea un nuevo post
      operationId: createPost
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePostRequest'
            examples:
              createPost:
                summary: Crear post
                value:
                  title: "My First Post"
                  content: "This is the content of my first post..."
                  tags: ["introduction", "first-post"]
                  visibility: "public"
      responses:
        '201':
          description: Post creado exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostResponse'
              examples:
                postCreated:
                  summary: Post creado
                  value:
                    success: true
                    data:
                      id: "post_456"
                      title: "My First Post"
                      content: "This is the content of my first post..."
                      author:
                        id: "user_123"
                        firstName: "John"
                        lastName: "Doe"
                        avatar: "https://cdn.conectate.com/avatars/user_123.jpg"
                      tags: ["introduction", "first-post"]
                      likes: 0
                      comments: 0
                      shares: 0
                      visibility: "public"
                      createdAt: "2024-01-20T15:30:00Z"
                      updatedAt: "2024-01-20T15:30:00Z"
                    message: "Post created successfully"
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
      x-rate-limit: 10/minute

  /posts/{postId}:
    get:
      tags: [Content]
      summary: Obtener post específico
      description: Recupera un post específico por ID
      operationId: getPostById
      parameters:
        - name: postId
          in: path
          required: true
          description: ID del post
          schema:
            type: string
            format: uuid
            example: "post_123"
      responses:
        '200':
          description: Post obtenido exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostResponse'
              examples:
                postDetail:
                  summary: Detalle del post
                  value:
                    success: true
                    data:
                      id: "post_123"
                      title: "Introduction to Machine Learning"
                      content: "Machine learning is a subset of artificial intelligence..."
                      author:
                        id: "user_123"
                        firstName: "John"
                        lastName: "Doe"
                        avatar: "https://cdn.conectate.com/avatars/user_123.jpg"
                      tags: ["machine-learning", "ai", "technology"]
                      likes: 42
                      comments: 8
                      shares: 3
                      visibility: "public"
                      createdAt: "2024-01-15T10:30:00Z"
                      updatedAt: "2024-01-15T10:30:00Z"
        '404':
          description: Post no encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                postNotFound:
                  summary: Post no encontrado
                  value:
                    success: false
                    error:
                      code: "POST_NOT_FOUND"
                      message: "Post not found"
                      details: "Post with ID post_123 does not exist"
        '500':
          $ref: '#/components/responses/InternalServerError'

    put:
      tags: [Content]
      summary: Actualizar post
      description: Actualiza un post existente
      operationId: updatePost
      security:
        - bearerAuth: []
      parameters:
        - name: postId
          in: path
          required: true
          description: ID del post
          schema:
            type: string
            format: uuid
            example: "post_123"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePostRequest'
            examples:
              updatePost:
                summary: Actualizar post
                value:
                  title: "Updated Post Title"
                  content: "Updated content..."
                  tags: ["updated", "content"]
                  visibility: "public"
      responses:
        '200':
          description: Post actualizado exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostResponse'
              examples:
                postUpdated:
                  summary: Post actualizado
                  value:
                    success: true
                    data:
                      id: "post_123"
                      title: "Updated Post Title"
                      content: "Updated content..."
                      updatedAt: "2024-01-20T16:30:00Z"
                    message: "Post updated successfully"
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: No autorizado para editar este post
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                notAuthorized:
                  summary: No autorizado
                  value:
                    success: false
                    error:
                      code: "NOT_AUTHORIZED"
                      message: "Not authorized to edit this post"
                      details: "You can only edit your own posts"
        '404':
          description: Post no encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'

    delete:
      tags: [Content]
      summary: Eliminar post
      description: Elimina un post existente
      operationId: deletePost
      security:
        - bearerAuth: []
      parameters:
        - name: postId
          in: path
          required: true
          description: ID del post
          schema:
            type: string
            format: uuid
            example: "post_123"
      responses:
        '200':
          description: Post eliminado exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteResponse'
              examples:
                postDeleted:
                  summary: Post eliminado
                  value:
                    success: true
                    message: "Post deleted successfully"
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: No autorizado para eliminar este post
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Post no encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'

  # 🔥 STREAMING ENDPOINTS - Endpoints de streaming
  /streaming/rooms:
    get:
      tags: [Streaming]
      summary: Obtener lista de salas de streaming
      description: Recupera una lista de salas de streaming activas
      operationId: getStreamingRooms
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          description: Número de página
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          description: Límite de resultados por página
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
        - name: category
          in: query
          description: Filtrar por categoría
          schema:
            type: string
            enum: [gaming, education, entertainment, music, talk]
      responses:
        '200':
          description: Lista de salas obtenida exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StreamingRoomsResponse'
              examples:
                roomsList:
                  summary: Lista de salas
                  value:
                    success: true
                    data:
                      rooms:
                        - id: "room_123"
                          title: "Gaming Session"
                          description: "Join us for an exciting gaming session"
                          host:
                            id: "user_456"
                            firstName: "Jane"
                            lastName: "Smith"
                            avatar: "https://cdn.conectate.com/avatars/user_456.jpg"
