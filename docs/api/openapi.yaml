        data:
          type: object
          properties:
            rooms:
              type: array
              items:
                $ref: '#/components/schemas/StreamingRoom'
            pagination:
              $ref: '#/components/schemas/Pagination'
        message:
          type: string
      example:
        success: true
        data:
          rooms:
            - id: "room_123"
              title: "Gaming Session"
              description: "Join us for an exciting gaming session"
              host:
                id: "user_456"
                firstName: "Jane"
                lastName: "Smith"
                avatar: "https://cdn.conectate.com/avatars/user_456.jpg"
              category: "gaming"
              isLive: true
              viewers: 125
              maxViewers: 500
              thumbnail: "https://cdn.conectate.com/thumbnails/room_123.jpg"
              startedAt: "2024-01-20T18:00:00Z"
          pagination:
            page: 1
            limit: 20
            total: 45
            totalPages: 3
            hasNext: true
            hasPrev: false
        message: "Streaming rooms retrieved successfully"

    # 🔥 ML & AI SCHEMAS - Esquemas de ML y AI
    UserBehaviorPredictionRequest:
      type: object
      required: [userId, timeWindow]
      properties:
        userId:
          type: string
          format: uuid
          description: ID del usuario
          example: "user_123"
        timeWindow:
          type: string
          pattern: ^\d+[dwm]$
          description: Ventana de tiempo para análisis
          example: "7d"
        features:
          type: array
          items:
            type: string
          description: Características a analizar
          example: ["sessionCount", "avgSessionDuration", "interactionRate", "contentDiversity"]
      example:
        userId: "user_123"
        timeWindow: "7d"
        features:
          - sessionCount
          - avgSessionDuration
          - interactionRate
          - contentDiversity

    UserBehaviorPredictionResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: object
          properties:
            userId:
              type: string
              format: uuid
              description: ID del usuario
              example: "user_123"
            behaviorCategory:
              type: string
              enum: [ACTIVE_USER, CASUAL_USER, POWER_USER, DORMANT_USER, AT_RISK_USER]
              description: Categoría de comportamiento predicha
              example: "ACTIVE_USER"
            confidence:
              type: number
              format: float
              minimum: 0
              maximum: 1
              description: Confianza de la predicción
              example: 0.85
            predictions:
              type: array
              items:
                type: object
                properties:
                  category:
                    type: string
                    enum: [ACTIVE_USER, CASUAL_USER, POWER_USER, DORMANT_USER, AT_RISK_USER]
                    description: Categoría de comportamiento
                  probability:
                    type: number
                    format: float
                    minimum: 0
                    maximum: 1
                    description: Probabilidad de la categoría
              description: Predicciones detalladas
              example:
                - category: "ACTIVE_USER"
                  probability: 0.85
                - category: "CASUAL_USER"
                  probability: 0.10
            features:
              type: object
              description: Características analizadas
              example:
                sessionCount: 25
                avgSessionDuration: 1800
                interactionRate: 0.75
                contentDiversity: 0.65
            timestamp:
              type: string
              format: date-time
              description: Timestamp de la predicción
              example: "2024-01-20T20:00:00Z"
        message:
          type: string
      example:
        success: true
        data:
          userId: "user_123"
          behaviorCategory: "ACTIVE_USER"
          confidence: 0.85
          predictions:
            - category: "ACTIVE_USER"
              probability: 0.85
            - category: "CASUAL_USER"
              probability: 0.10
          features:
            sessionCount: 25
            avgSessionDuration: 1800
            interactionRate: 0.75
            contentDiversity: 0.65
          timestamp: "2024-01-20T20:00:00Z"
        message: "User behavior prediction completed"

    ContentRecommendationRequest:
      type: object
      required: [userId]
      properties:
        userId:
          type: string
          format: uuid
          description: ID del usuario
          example: "user_123"
        limit:
          type: integer
          minimum: 1
          maximum: 50
          default: 10
          description: Límite de recomendaciones
          example: 10
        context:
          type: object
          properties:
            lastViewed:
              type: string
              format: uuid
              description: Último contenido visto
              example: "post_456"
            interests:
              type: array
              items:
                type: string
              description: Intereses del usuario
              example: ["technology", "gaming", "music"]
      example:
        userId: "user_123"
        limit: 10
        context:
          lastViewed: "post_456"
          interests: ["technology", "gaming", "music"]

    ContentRecommendationResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: object
          properties:
            userId:
              type: string
              format: uuid
              description: ID del usuario
              example: "user_123"
            recommendations:
              type: array
              items:
                type: object
                properties:
                  contentId:
                    type: string
                    format: uuid
                    description: ID del contenido recomendado
                    example: "post_789"
                  score:
                    type: number
                    format: float
                    minimum: 0
                    maximum: 1
                    description: Score de la recomendación
                    example: 0.92
                  reason:
                    type: string
                    description: Razón de la recomendación
                    example: "ML Recommendation"
                  metadata:
                    type: object
                    description: Metadatos del contenido
                    example:
                      title: "Advanced Machine Learning Techniques"
                      author: "Jane Smith"
                      tags: ["machine-learning", "ai", "advanced"]
            timestamp:
              type: string
              format: date-time
              description: Timestamp de las recomendaciones
              example: "2024-01-20T20:00:00Z"
        message:
          type: string
      example:
        success: true
        data:
          userId: "user_123"
          recommendations:
            - contentId: "post_789"
              score: 0.92
              reason: "ML Recommendation"
              metadata:
                title: "Advanced Machine Learning Techniques"
                author: "Jane Smith"
                tags: ["machine-learning", "ai", "advanced"]
            - contentId: "post_790"
              score: 0.87
              reason: "Based on your interests"
              metadata:
                title: "Gaming Technology Trends 2024"
                author: "Bob Johnson"
                tags: ["gaming", "technology", "trends"]
          timestamp: "2024-01-20T20:00:00Z"
        message: "Content recommendations generated successfully"

    # 🔥 COMMON SCHEMAS - Esquemas comunes
    Pagination:
      type: object
      properties:
        page:
          type: integer
          minimum: 1
          description: Página actual
          example: 1
        limit:
          type: integer
          minimum: 1
          description: Límite de resultados por página
          example: 20
        total:
          type: integer
          minimum: 0
          description: Total de resultados
          example: 156
        totalPages:
          type: integer
          minimum: 0
          description: Total de páginas
          example: 8
        hasNext:
          type: boolean
          description: Indica si hay página siguiente
          example: true
        hasPrev:
          type: boolean
          description: Indica si hay página anterior
          example: false
      example:
        page: 1
        limit: 20
        total: 156
        totalPages: 8
        hasNext: true
        hasPrev: false

    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        error:
          type: object
          properties:
            code:
              type: string
              description: Código de error
              example: "VALIDATION_ERROR"
            message:
              type: string
              description: Mensaje de error
              example: "Invalid input data"
            details:
              type: string
              description: Detalles adicionales del error
              example: "Email format is invalid"
            timestamp:
              type: string
              format: date-time
              description: Timestamp del error
              example: "2024-01-20T20:00:00Z"
      example:
        success: false
        error:
          code: "VALIDATION_ERROR"
          message: "Invalid input data"
          details: "Email format is invalid"
          timestamp: "2024-01-20T20:00:00Z"

    DeleteResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: "Resource deleted successfully"
      example:
        success: true
        message: "Post deleted successfully"

  # 🔥 RESPONSES - Respuestas reutilizables
  responses:
    BadRequest:
      description: Solicitud inválida
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            validationError:
              summary: Error de validación
              value:
                success: false
                error:
                  code: "VALIDATION_ERROR"
                  message: "Invalid input data"
                  details: "Email format is invalid"
                  timestamp: "2024-01-20T20:00:00Z"

    Unauthorized:
      description: No autorizado
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            unauthorizedError:
              summary: Error de autorización
              value:
                success: false
                error:
                  code: "UNAUTHORIZED"
                  message: "Authentication required"
                  details: "Please provide valid authentication credentials"
                  timestamp: "2024-01-20T20:00:00Z"

    TooManyRequests:
      description: Demasiadas solicitudes
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            rateLimitError:
              summary: Error de rate limit
              value:
                success: false
                error:
                  code: "RATE_LIMIT_EXCEEDED"
                  message: "Too many requests"
                  details: "Rate limit exceeded. Try again later."
                  timestamp: "2024-01-20T20:00:00Z"
      headers:
        Retry-After:
          description: Tiempo de espera antes de reintentar
          schema:
            type: integer
            example: 60

    InternalServerError:
      description: Error interno del servidor
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            serverError:
              summary: Error del servidor
              value:
                success: false
                error:
                  code: "INTERNAL_SERVER_ERROR"
                  message: "Internal server error"
                  details: "An unexpected error occurred"
                  timestamp: "2024-01-20T20:00:00Z"

