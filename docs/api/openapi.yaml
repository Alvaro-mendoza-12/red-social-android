# 🔥 COMPONENTS - Componentes reutilizables
components:
  # 🔥 SECURITY SCHEMES - Esquemas de seguridad
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        JWT Bearer Token authentication
        
        Para autenticarse, incluye el token en el header:
        ```
        Authorization: Bearer <token>
        ```
        
        El token se obtiene del endpoint `/auth/login`.

  # 🔥 SCHEMAS - Esquemas de datos
  schemas:
    # 🔥 AUTHENTICATION SCHEMAS - Esquemas de autenticación
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          description: Email del usuario
          example: "user@conectate.com"
        password:
          type: string
          minLength: 8
          description: Contraseña del usuario
          example: "password123"
        rememberMe:
          type: boolean
          description: Recordar sesión
          default: false
      example:
        email: "user@conectate.com"
        password: "password123"
        rememberMe: true

    LoginResponse:
      type: object
      properties:
        success:
          type: boolean
          description: Indica si la operación fue exitosa
        data:
          type: object
          properties:
            user:
              $ref: '#/components/schemas/User'
            tokens:
              $ref: '#/components/schemas/Tokens'
        message:
          type: string
          description: Mensaje de respuesta
      example:
        success: true
        data:
          user:
            id: "user_123"
            email: "user@conectate.com"
            firstName: "John"
            lastName: "Doe"
            avatar: "https://cdn.conectate.com/avatars/user_123.jpg"
            verified: true
            createdAt: "2024-01-01T00:00:00Z"
          tokens:
            accessToken: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
            refreshToken: "refresh_token_abc123"
            expiresIn: 3600
            tokenType: "Bearer"
        message: "Login successful"

    RegisterRequest:
      type: object
      required: [email, password, firstName, lastName, acceptTerms, acceptPrivacy]
      properties:
        email:
          type: string
          format: email
          description: Email del usuario
          example: "newuser@conectate.com"
        password:
          type: string
          minLength: 8
          description: Contraseña del usuario
          example: "password123"
        firstName:
          type: string
          minLength: 1
          maxLength: 50
          description: Nombre del usuario
          example: "John"
        lastName:
          type: string
          minLength: 1
          maxLength: 50
          description: Apellido del usuario
          example: "Doe"
        acceptTerms:
          type: boolean
          description: Acepta términos y condiciones
          example: true
        acceptPrivacy:
          type: boolean
          description: Acepta política de privacidad
          example: true
      example:
        email: "newuser@conectate.com"
        password: "password123"
        firstName: "John"
        lastName: "Doe"
        acceptTerms: true
        acceptPrivacy: true

    RegisterResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: object
          properties:
            user:
              $ref: '#/components/schemas/User'
            verificationToken:
              type: string
              description: Token de verificación de email
        message:
          type: string
      example:
        success: true
        data:
          user:
            id: "user_456"
            email: "newuser@conectate.com"
            firstName: "John"
            lastName: "Doe"
            avatar: null
            verified: false
            createdAt: "2024-01-01T00:00:00Z"
          verificationToken: "verify_token_abc123"
        message: "User registered successfully. Please check your email."

    RefreshTokenRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken:
          type: string
          description: Refresh token
          example: "refresh_token_abc123"
      example:
        refreshToken: "refresh_token_abc123"

    RefreshTokenResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: object
          properties:
            accessToken:
              type: string
              description: Nuevo access token
              example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
            expiresIn:
              type: integer
              description: Tiempo de expiración en segundos
              example: 3600
            tokenType:
              type: string
              description: Tipo de token
              example: "Bearer"
        message:
          type: string
      example:
        success: true
        data:
          accessToken: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
          expiresIn: 3600
          tokenType: "Bearer"
        message: "Token refreshed successfully"

    LogoutResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
      example:
        success: true
        message: "Logged out successfully"

