  min-height: 2.2rem;
}

.w-full {
  width: 100%;
}

.mt-2 {
  margin-top: 0.5rem;
}

.p-2 {
  padding: 0.5rem;
}

.flex-1 {
  flex: 1 1 auto;
}

.wrap {
  flex-wrap: wrap;
}

.fade-in {
  animation: rise 0.2s ease-out;
}

.shadow-sm {
  box-shadow: 0 1px 2px rgba(15, 23, 42, 0.08);
}

.shadow-lg {
  box-shadow: 0 20px 40px rgba(15, 23, 42, 0.2);
}

.circle-btn {
  width: 46px;
  height: 46px;
  min-width: 46px;
  border-radius: 50%;
  padding: 0 !important;
  line-height: 1;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}

.circle-btn svg {
  width: 22px;
  height: 22px;
}

.primary-btn.circle-btn:hover {
  transform: none;
}

.chat-audio-player {
  width: min(280px, 100%);
  max-width: 100%;
  height: 34px;
}

@keyframes micPulse {
  0% {
    box-shadow: 0 0 0 0 rgba(248, 113, 113, 0.34);
  }
  70% {
    box-shadow: 0 0 0 7px rgba(248, 113, 113, 0);
  }
  100% {
    box-shadow: 0 0 0 0 rgba(248, 113, 113, 0);
  }
}

.stickers-tray {
  background: white;
  border-top: 1px solid var(--line);
  max-height: 300px;
  display: flex;
  flex-direction: column;
}

.sticker-grid-compact {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(80px, 1fr));
  gap: 0.5rem;
  padding: 0.5rem;
  overflow-y: auto;
}

.sticker-item-btn {
  background: none;
  border: 0;
  padding: 0.25rem;
  cursor: pointer;
  border-radius: 8px;
  transition: transform 0.2s;
}

.sticker-item-btn:hover {
  background: #f3f4f6;
  transform: scale(1.1);
}

.sticker-item-btn img {
  width: 100%;
  height: auto;
}

.checkbox-inline {
  display: inline-flex;
  align-items: center;
  gap: 0.4rem;
  color: var(--ink-700);
}

.file-pick-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
}

.reaction-row {
  display: flex;
  flex-wrap: wrap;
  gap: 0.35rem;
}

.reaction-chip {
  border: 1px solid #d4d4d8;
  border-radius: 999px;
  background: white;
  color: var(--ink-700);
  padding: 0.2rem 0.5rem;
  font-size: 0.78rem;
  cursor: pointer;
}

.mini-action-btn {
  border: 1px solid #d4d4d8;
  border-radius: 999px;
  background: white;
  color: var(--ink-700);
  padding: 0.2rem 0.5rem;
  font-size: 0.74rem;
  cursor: pointer;
}

.mini-action-btn.danger {
  border-color: #fda4af;
  color: #be123c;
}

.surface-subcard {
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 0.65rem;
  background: #fff;
  display: grid;
  gap: 0.35rem;
}

.qr-tile {
  border: 1px solid var(--line);
  border-radius: 18px;
  background: linear-gradient(135deg, #ffffff, #fff7ed);
  padding: 1rem;
  display: grid;
  justify-items: center;
  gap: 0.55rem;
  text-align: center;
}

.qr-tile.compact {
  padding: 0.8rem;
}

.qr-image {
  width: min(240px, 100%);
  border-radius: 16px;
  background: white;
  padding: 0.55rem;
  border: 1px solid var(--line);
}

.reply-preview {
  border-left: 3px solid #fb7185;
  background: #fff1f2;
  border-radius: 8px;
  padding: 0.4rem 0.55rem;
  color: var(--ink-700);
  font-size: 0.82rem;
}

.muted-line {
  color: var(--ink-500);
  font-style: italic;
}

.poll-stack {
  display: grid;
  gap: 0.45rem;
}

.poll-option {
  border: 1px solid #d4d4d8;
  border-radius: 10px;
  padding: 0.42rem 0.58rem;
  background: white;
  display: flex;
  justify-content: space-between;
  align-items: center;
  color: var(--ink-700);
  cursor: pointer;
}

.poll-option.active {
  border-color: #fb7185;
  background: #fff1f2;
  color: #be123c;
}

.sticker-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
  gap: 0.55rem;
}

.sticker-preview {
  width: 100%;
  max-height: 130px;
  object-fit: contain;
  border-radius: 10px;
  background: #f8fafc;
}

.receipt-stack {
  display: grid;
  gap: 0.15rem;
}

.folder-tag {
  display: inline-flex;
  align-items: center;
  border: 1px solid #fecdd3;
  border-radius: 999px;
  background: #fff1f2;
  color: #be123c;
  font-size: 0.74rem;
  padding: 0.15rem 0.52rem;
}

.profile-hero {
  padding: 0;
  overflow: hidden;
}

.profile-cover {
  min-height: 180px;
  background: linear-gradient(135deg, #fecdd3 0%, #fdba74 100%);
  background-size: cover;
  background-position: center;
}

.profile-hero-content {
  margin-top: -46px;
  padding: 0 1rem 1rem;
  display: grid;
  gap: 0.75rem;
}

.profile-qr-card {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  gap: 1rem;
  align-items: center;
}

.profile-avatar {
  width: 92px;
  height: 92px;
  border-radius: 999px;
  border: 4px solid white;
  object-fit: cover;
  background: #fff1f2;
}

.profile-enterprise-grid,
.settings-mini-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 1rem;
}

.profile-facts-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 0.65rem;
}

.linked-games-grid {
  display: flex;
  flex-wrap: wrap;
  gap: 0.5rem;
}

.linked-game-pill {
  display: inline-flex;
  align-items: center;
  gap: 0.42rem;
  border: 1px solid #fed7aa;
  border-radius: 999px;
  padding: 0.24rem 0.62rem;
  background: #fff7ed;
  color: #9a3412;
  font-weight: 700;
  font-size: 0.82rem;
}

.linked-game-pill img {
  width: 22px;
  height: 22px;
  border-radius: 6px;
  object-fit: cover;
}

.monetization-hero {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 1rem;
  background:
    radial-gradient(circle at top right, rgba(5, 150, 105, 0.14), transparent 28%),
    linear-gradient(135deg, rgba(255, 255, 255, 0.98), rgba(240, 253, 244, 0.94));
}

.social-shell {
  display: grid;
  gap: 0.8rem;
}

.social-overview-card {
  overflow: hidden;
  background:
    radial-gradient(circle at top right, rgba(244, 63, 94, 0.15), transparent 28%),
    radial-gradient(circle at bottom left, rgba(249, 115, 22, 0.16), transparent 30%),
    linear-gradient(135deg, rgba(255, 255, 255, 0.98), rgba(255, 247, 237, 0.98));
}

.social-overview-head {
  display: grid;
  grid-template-columns: minmax(0, 1.3fr) auto;
  gap: 1rem;
  align-items: center;
}

.social-overview-copy h2 {
  margin: 0.55rem 0 0.35rem;
}

.social-overview-actions {
  justify-content: flex-end;
}

.social-chip-row {
  margin-top: 0.65rem;
}

.settings-hero-card {
  overflow: hidden;
  background:
    radial-gradient(circle at top right, rgba(249, 115, 22, 0.14), transparent 28%),
    radial-gradient(circle at bottom left, rgba(244, 63, 94, 0.14), transparent 32%),
    linear-gradient(135deg, rgba(255, 255, 255, 0.98), rgba(255, 247, 237, 0.98));
}

.settings-hero-head {
  align-items: flex-start;
}

.settings-hero-meta {
  display: grid;
  gap: 0.35rem;
  justify-items: end;
  text-align: right;
}

.settings-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 1rem;
}

.settings-stack {
  gap: 0.8rem;
}

.settings-access-card {
  display: grid;
  gap: 0.75rem;
}

.settings-toggle-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 0.8rem;
}

.settings-toggle-card {
  border: 1px solid var(--line);
  border-radius: 14px;
  background: #fff;
  padding: 0.9rem;
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 1rem;
}

.settings-toggle-card strong {
  display: block;
  margin-bottom: 0.25rem;
}

.settings-toggle-card input {
  margin-top: 0.25rem;
}

.settings-toggle-card.vertical {
  display: grid;
}

.expandable-text-block {
  display: grid;
  gap: 0.15rem;
}

.expandable-text {
  white-space: pre-line;
}

.expandable-text.collapsed {
  display: -webkit-box;
  -webkit-line-clamp: var(--clamp-lines, 3);
  -webkit-box-orient: vertical;
  overflow: hidden;
}

.inline-text-toggle {
  border: 0;
  background: transparent;
  padding: 0;
  cursor: pointer;
}

@keyframes rise {
  from {
    opacity: 0;
    transform: translateY(6px);
  }

  to {
    opacity: 1;
    transform: translateY(0);
  }
}

@media (max-width: 980px) {
  .app-shell {
    grid-template-columns: 1fr;
  }

  .left-nav {
    display: none;
  }

  .content-pane {
    padding: 0.85rem 0.85rem 5.5rem;
  }

  .mobile-nav {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(64px, 1fr));
    gap: 0.2rem;
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    z-index: 8;
    background: rgba(255, 255, 255, 0.95);
    border-top: 1px solid var(--line);
    padding: 0.5rem;
  }

  .mobile-item {
    position: relative;
    border-radius: 10px;
    text-align: center;
    padding: 0.55rem 0.15rem;
    color: var(--ink-700);
    font-size: 0.7rem;
    font-weight: 600;
  }

  .mobile-item-inner {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 0.25rem;
    position: relative;
  }

  .mobile-nav-icon {
    width: 1.25rem;
    height: 1.25rem;
    display: inline-flex;
    align-items: center;
    justify-content: center;
  }

  .mobile-nav-icon svg {
    width: 1.05rem;
    height: 1.05rem;
    stroke: currentColor;
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
    fill: none;
  }

  .mobile-counter {
    position: absolute;
    top: -0.4rem;
    right: -0.8rem;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-width: 1rem;
    height: 1rem;
    padding: 0 0.28rem;
    border-radius: 999px;
    background: #e11d48;
    color: #fff;
    font-size: 0.6rem;
    font-weight: 700;
    line-height: 1;
  }

  .mobile-item.active {
    background: #fff1f2;
    color: #be123c;
  }

  .story-viewer-shell {
    min-height: calc(100vh - 160px);
    border-radius: 14px;
    padding: 0.55rem;
  }

  .stats-grid-wide {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }

  .messages-split-layout {
    border: 0;
    border-radius: 0;
    grid-template-columns: 1fr;
  }

  .messages-list-pane {
    border-right: 0;
    padding: 0;
  }

  .messages-detail-pane {
    display: none;
  }

  .conversation-row {
    grid-template-columns: 42px minmax(0, 1fr) auto;
    align-items: center;
  }

  .more-btn {
    opacity: 1;
  }

  .story-viewer-content {
    grid-template-columns: 1fr;
  }

  .story-nav-btn {
    display: none;
  }

  .story-reply-bar {
    grid-template-columns: minmax(0, 1fr);
  }

  .feed-hero-copy,
  .social-overview-head,
  .profile-qr-card,
  .profile-enterprise-grid,
  .profile-facts-grid,
  .settings-grid,
  .settings-mini-grid,
  .settings-toggle-grid {
    grid-template-columns: 1fr;
  }

  .feed-hero-stats {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }

  .settings-hero-meta {
    justify-items: start;
    text-align: left;
  }
}
